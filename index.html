const CTX={
 spray:{art:'sprayBurn',cls:'red',title:_('先排除喷施灼伤','Rule out spray injury first','Ketepikan kecederaan semburan dahulu'),text:_('喷后 1–3 天出现、只在被喷湿的叶片上、新梢和向阳面最重、斑点或焦边沿着喷到的地方分布——这是灼伤，不是缺素。原因：浓度太高、中午喷、没加展着剂、几种药肥混在一桶。处理：清水冲叶，停喷 2 周，下次减半浓度、傍晚喷、先试几棵。','Appearing 1–3 days after spraying, only on leaves that were wet, worst on new flush and the sunny side, spots or scorch following where the spray landed — that is injury, not deficiency. Causes: too strong a mix, midday spraying, no wetting agent, several products stacked in one tank. Fix: rinse with clean water, no spraying for 2 weeks, next time halve the strength, spray in the evening and test a few trees first.','Muncul 1–3 hari selepas sembur, hanya pada daun yang basah, paling teruk pada pucuk baru dan sisi cerah, bintik atau hangus mengikut tempat semburan — itu kecederaan, bukan kekurangan. Punca: campuran terlalu pekat, sembur tengah hari, tiada agen pembasah, beberapa produk dalam satu tangki. Pemulihan: bilas dengan air bersih, jangan sembur 2 minggu, kali seterusnya separuhkan kepekatan, sembur petang dan uji beberapa pokok dahulu.')},
 fert:{art:'saltPile',cls:'red',title:_('先排除肥料烧根','Rule out fertiliser burn first','Ketepikan baja terbakar dahulu'),text:_('施肥后几天内整树老叶叶缘同时焦枯、萎蔫、落叶——这是盐害，不是缺钾。肥料堆在树干边、一次量太大、干土施肥最容易出。处理：大水淋洗，停肥，之后撒在滴水线、分次。去土壤页量 EC 确认。','Within days of fertilising, margins of all older leaves scorch at once, wilting, leaf drop — that is salt injury, not K deficiency. Fertiliser piled at the trunk, one big dose or feeding dry soil causes it. Fix: leach with plenty of water, stop fertiliser, then spread at the drip line in splits. Measure EC on the Soil page to confirm.','Dalam beberapa hari selepas baja, tepi semua daun tua hangus serentak, layu, gugur — itu kecederaan garam, bukan kekurangan K. Baja dilonggok di batang, satu dos besar atau baja pada tanah kering menyebabkannya. Pemulihan: larut resap dengan banyak air, hentikan baja, kemudian tabur di garis titisan secara berbahagi. Ukur EC di halaman Tanah untuk sahkan.')},
 rain:{art:'root',cls:'amber',title:_('先想到积水和冲刷','Think waterlogging and leaching first','Fikirkan takungan dan larut resap dahulu'),text:_('大雨后新叶黄化像缺铁、老叶黄落像缺氮——多半是根缺氧和养分被冲走，不是土里没有。先开沟排水，等土壤透气 1–2 周再判断；雨后也常抽新梢与果争养分。','After heavy rain, young-leaf yellowing looks like Fe deficiency and old-leaf yellowing and drop look like N — usually the roots are short of oxygen and nutrients have leached, not that the soil is empty. Open drains first and judge again 1–2 weeks after the soil breathes; rain also triggers a flush that competes with fruit.','Selepas hujan lebat, daun muda menguning seperti kekurangan Fe dan daun tua menguning serta gugur seperti N — biasanya akar kekurangan oksigen dan nutrien terhanyut, bukan tanah kosong. Buka parit dahulu dan nilai semula 1–2 minggu selepas tanah bernafas; hujan juga mencetuskan pucuk yang bersaing dengan buah.')},
 young:{art:'sapling',cls:'amber',title:_('幼树更脆弱','Young trees are more vulnerable','Pokok muda lebih mudah terjejas'),text:_('3 年以下的树根系浅、储备少，缺素和烧根都来得快、重，严重时整株死亡。幼树要氮磷镁多、量少次多，肥料离树干至少 30 cm，缺素喷施浓度减半。','Trees under 3 years have shallow roots and no reserves, so both deficiency and burn come faster and harder, and can kill the tree. Young trees want more N, P and Mg in small frequent doses, fertiliser at least 30 cm from the trunk, and foliar sprays at half strength.','Pokok bawah 3 tahun berakar cetek tanpa simpanan, jadi kekurangan dan kebakaran datang lebih cepat dan teruk, boleh membunuh pokok. Pokok muda perlu lebih N, P dan Mg dalam dos kecil kerap, baja sekurang-kurangnya 30 cm dari batang, dan semburan daun separuh kepekatan.')},
 flush:{art:'leaves3',cls:'amber',title:_('抽梢换叶期的正常现象','What is normal during a flush','Perkara biasa semasa berpucuk'),text:_('抽新梢时老叶变黄脱落是树在搬运养分，开花前落一批老叶也正常——只要新叶健康、颜色均匀就不是缺素。真缺素是新叶也小、也黄，或老叶黄得只剩顶端几片。','Old leaves yellowing and dropping during a flush is the tree moving nutrients, and shedding a batch before flowering is normal too — as long as the new leaves are healthy and evenly coloured it is not deficiency. Real deficiency shows when the new leaves are also small or yellow, or when so many old leaves drop that only the tips are left.','Daun tua menguning dan gugur semasa berpucuk ialah pokok memindahkan nutrien, dan menggugurkan sekumpulan sebelum berbunga juga normal — selagi daun baru sihat dan sekata warnanya, ia bukan kekurangan. Kekurangan sebenar apabila daun baru juga kecil atau kuning, atau begitu banyak daun tua gugur hingga tinggal hujung sahaja.')}

const NONE_CARD={art:'leaves3',title:_('不符合任何一种','No pattern matched','Tiada corak yang sepadan'),text:_('没关系——这样做：1) 同一枝条摘最老、中间、最新叶各一片并排拍照；2) 看黄的是整片、叶脉间、叶缘还是叶尖；3) 问自己最近两周有没有喷药、施肥、大雨；4) 量土壤 pH 和 EC；5) 若整园同时出现，是环境或天气，不是缺素。两周后同一枝条再拍一张对比，再回来辨症。','No problem — do this: 1) from one branch pick the oldest, a middle and the newest leaf, lay them side by side and photograph; 2) note whether the yellow is whole-leaf, between veins, on the margin or at the tip; 3) ask whether there was spraying, fertilising or heavy rain in the last 2 weeks; 4) measure soil pH and EC; 5) if the whole orchard shows it at once, it is environment or weather, not deficiency. Photograph the same branch again in 2 weeks and come back.','Tidak mengapa — buat begini: 1) dari satu dahan petik daun tertua, tengah dan terbaru, susun bersebelahan dan ambil gambar; 2) perhatikan sama ada kuning seluruh daun, antara urat, tepi atau hujung; 3) tanya adakah ada semburan, baja atau hujan lebat dalam 2 minggu lepas; 4) ukur pH dan EC tanah; 5) jika seluruh dusun serentak, ia persekitaran atau cuaca, bukan kekurangan. Ambil gambar dahan sama 2 minggu kemudian dan kembali.')};
const COMBO_TXT=_('多种缺素同时出现很常见，症状会叠加。做法：先处理最明显、最影响产量的一种，2 周后再看；钾和镁常一起缺——施钾一定配镁；新叶和老叶同时黄多半是 pH 或根的问题，不是两种养分都缺。','Several deficiencies at once is common and the symptoms overlap. Treat the clearest one that hurts yield most, re-check in 2 weeks; K and Mg often go short together — always pair K with Mg; young and old leaves yellowing at the same time usually means pH or roots, not two nutrients missing.','Beberapa kekurangan serentak adalah biasa dan simptom bertindih. Rawat yang paling jelas dan paling menjejaskan hasil dahulu, semak 2 minggu kemudian; K dan Mg sering kurang bersama — sentiasa gandingkan K dengan Mg; daun muda dan tua menguning serentak biasanya bermakna pH atau akar, bukan dua nutrien hilang.');

let tab=0,path=[],sel=[],done=false,ctx=new Set(),phVal='',ecVal='',ecUnit='ds',ecMeth='m15',phMeth='probe',tex='loam',stage=0;
let crop=localStorage.getItem('nt_crop')||'durian';if(!CROPS_CFG[crop])crop='durian';let cropG=CROPS_CFG[crop].g;
function setCrop(c){crop=c;localStorage.setItem('nt_crop',c);cropG=CROPS_CFG[c].g;render();}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=()=>lang==='zh'?'：':': ';
const num=v=>{v=String(v).trim().replace(',','.');return /^\d*\.?\d+$/.test(v)?parseFloat(v):NaN;};

function setLang(l){lang=l;localStorage.setItem('nt_lang',l);document.documentElement.lang=l==='zh'?'zh':l==='bm'?'ms':'en';$('#langScreen').style.display='none';$('#app').style.display='block';render();}
function keepPlace(fn){ /* re-render without losing scroll position or open sections */
 const v=$('#view');const open=[...v.querySelectorAll('details')].map(d=>d.open);
 const max=document.documentElement.scrollHeight-window.innerHeight;const ratio=max>0?window.scrollY/max:0;
 fn();
 const ds=v.querySelectorAll('details');open.forEach((o,i)=>{if(ds[i])ds[i].open=o;});
 const max2=document.documentElement.scrollHeight-window.innerHeight;window.scrollTo(0,Math.round(ratio*Math.max(0,max2)));
}
function cycleLang(){keepPlace(()=>setLang(LANGORDER[(LANGORDER.indexOf(lang)+1)%3]));}
function cycleSize(){keepPlace(()=>{fsIdx=(fsIdx+1)%FS.length;localStorage.setItem('nt_fs',fsIdx);applySize();});}
function applySize(){document.documentElement.style.setProperty('--fs',FS[fsIdx]+'px');}
function mobTag(m){return `<span class="tag ${m}">${t(m==='m'?UI.mobile:m==='i'?UI.immobile:UI.inter)}</span>`;}

const ICONS=[
 '<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/><path d="M7 11c1-3 3-4 6-4"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M5 20c0-8 5-14 14-15-1 9-7 14-14 15z"/><path d="M5 20c3-5 7-8 11-10"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M3 8h18M3 13h18M3 18h18"/><path d="M7 8V5M12 13v-2M17 18v-2"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>'
];

function render(){
 $('#hTitle').textContent=t(UI.title);
 $('#btnLang').textContent=LANGLBL[lang];
 applySize();
 $('#nav').innerHTML=UI.nav.map((n,i)=>`<button class="${i===tab?'on':''}" onclick="if(tab===${i}&&${i}===0)resetDiag();else{tab=${i};render();window.scrollTo(0,0)}">${ICONS[i]}<span>${t(n)}</span></button>`).join('');
 const v=$('#view');
 if(tab===0)v.innerHTML=renderDiag();
 else if(tab===1)v.innerHTML=renderNutrients();
 else if(tab===2)v.innerHTML=renderSoil();
 else v.innerHTML=renderRef();
 v.innerHTML+=`<footer class="note">${t(UI.disclaimer)}</footer>`;
}

/* --- Diagnose --- */
function cropBar(){return `<label class="f">${t(UI.cropLbl)}</label><div class="tiles t4">${[['durian','fruit2'],['fruit','healthyTree'],['veg','tomato'],['palm','palm']].map(([k,ic])=>`<button class="opt ${crop===k?'on':''}" onclick="setCrop('${k}')">${pic(ic)}<span>${t(UI.cropN[k])}</span></button>`).join('')}</div>`;}
function renderDiag(){
 if(path.length===0){
  return cropBar()+`<label class="f">${t(UI.ctxQ)}</label><div class="tiles" style="grid-template-columns:1fr 1fr 1fr">${[['spray','spray'],['fert','soil'],['rain','rain'],['young','sapling'],['flush','leaves3']].map(([k,ic])=>`<button class="opt ${ctx.has(k)?'on':''}" onclick="ctx.has('${k}')?ctx.delete('${k}'):ctx.add('${k}');render()">${pic(ic)}<span>${t(UI.ctxN[k])}</span></button>`).join('')}</div>
  <h2>${t(TREE.start.q)}</h2><div class="grid">${TREE.start.opts.map((o,i)=>`<button class="opt" onclick="path=[${i}];sel=[];done=false;pushStep();render();window.scrollTo(0,0)">${leaf(o.leaf)}<span>${t(o.lbl)}</span></button>`).join('')}</div>`;
 }
 const where=TREE.start.opts[path[0]],node=TREE[where.next];
 let h=chips(where,node)+`<h2>${t(node.q)}</h2><p class="muted">${t(UI.multiHint)}</p><div class="grid">${node.opts.map((o,i)=>`<button class="opt ${sel.includes(i)?'on':''}" onclick="sel=sel.filter(x=>x!=='none');sel.includes(${i})?sel=sel.filter(x=>x!==${i}):sel.push(${i});render();showResult()">${leaf(o.leaf)}<span>${t(o.lbl)}</span></button>`).join('')}<button class="opt ${sel.includes('none')?'on':''}" onclick="sel=['none'];render();showResult()">${pic('question')}<span>${t(UI.noneOpt)}</span></button></div>`;
 if(!sel.length)return h;
 h+=`<div id="result">`;
 for(const k of ['spray','fert','rain','young','flush'])if(ctx.has(k)){const c=CTX[k];h+=`<div class="card ${c.cls}"><div class="leafrow">${pic(c.art)}<div><span class="tag ${c.cls==='red'?'r':'a'}">${t(UI.checkFirst)}</span><h3>${t(c.title)}</h3></div></div><p>${t(c.text)}</p></div>`;}
 if(sel[0]==='none'){h+=`<div class="card blue"><div class="leafrow">${pic(NONE_CARD.art)}<h3>${t(NONE_CARD.title)}</h3></div><p>${t(NONE_CARD.text)}</p></div>`;}
 else{
  if(sel.length>1)h+=`<div class="card amber"><b>${t(UI.combo)}</b><p>${t(COMBO_TXT)}</p></div>`;
  sel.forEach(i=>{const o=node.opts[i];if(sel.length>1)h+=`<div class="sect">${t(o.lbl)}</div>`;h+=renderResult(o.res);});
 }
 h+=`<div class="card"><p>${t(UI.checkSoil)}</p><div class="row"><button class="btn fill" onclick="tab=2;render();window.scrollTo(0,0)">${t(UI.goSoil)} ›</button><button class="btn" onclick="shareResult()">WhatsApp</button></div></div>`;
 return h+`<p style="text-align:center;margin:.6rem 0"><a href="#" class="lnk" onclick="resetDiag();return false">${t(UI.another)}</a></p></div>`;
}
function showResult(){const r=document.getElementById('result');if(r)r.scrollIntoView({behavior:'smooth',block:'start'});}
function crumbsHtml(c){return c.length?`<div class="crumbs">${c.map(x=>`<span>${x}</span>`).join('')}</div>`:'';}
/* path chips: [home] › [where] › [pattern]… ; tapping any chip returns to that step */
function chips(where,node){
 const chip=(lbl,act,cur)=>`<button class="chip ${cur?'cur':''}" onclick="${act}">${lbl}</button>`;
 return `<div class="crumbs">${chip(t(UI.homeChip),"goStep(0)",false)+'<i>›</i>'+chip(t(where.lbl),"",true)}</div>`;
}
function pushStep(){try{history.pushState({d:1},'');}catch(e){}}
window.addEventListener('popstate',()=>{if(tab===0&&path.length){path=[];sel=[];done=false;render();window.scrollTo(0,0);}});
function goStep(n){if(n===0){path=[];sel=[];done=false;}render();window.scrollTo(0,0);}
function resetDiag(){path=[];sel=[];done=false;ctx.clear();render();window.scrollTo(0,0);}
function shareResult(){
 const where=TREE.start.opts[path[0]],node=TREE[where.next];
 let L=[`${t(UI.title)} · ${t(UI.cropN[crop])}`,`${t(where.lbl)}`];
 for(const k of ctx)L.push(`! ${t(UI.ctxN[k])} → ${t(CTX[k].title)}`);
 if(sel[0]==='none')L.push(t(NONE_CARD.title));
 else sel.forEach(i=>{const o=node.opts[i],r=o.res;L.push(`• ${t(o.lbl)}`);if(r.notNutrient)L.push(`  ${t(r.notNutrient.title)}`);r.main.forEach(id=>{const n=N[id];L.push(`  ${t(UI.likely)}: ${n.sym} ${t(n.name)}`,`  ${t(UI.foliar)}: ${t(n.foliar)}`,`  ${t(UI.soil)}: ${t(n.soil)}`);});if(r.alt.length)L.push(`  ${t(UI.alt)}: ${r.alt.map(id=>`${N[id].sym} ${t(N[id].name)}`).join(', ')}`);});
 L.push(APP_URL);
 openShare(L.join('\n'));
}
function renderResult(r){
 let h='';
 if(r.notNutrient){const n=r.notNutrient;h+=`<div class="card red res"><div class="leafrow">${leaf(n.leaf)}<div><span class="tag r">${t(UI.notNutrient)}</span><h3>${t(n.title)}</h3></div></div><p>${t(n.text)}</p></div>`;}
 r.main.forEach(id=>h+=nutCard(id,UI.likely,'green'));
 if(r.tell)h+=`<div class="card blue"><b>${t(UI.tell)}</b><p>${t(r.tell)}</p></div>`;
 if(r.rule)h+=`<div class="card amber"><b>${t(UI.rule)}</b><p>${t(r.rule)}</p></div>`;
 r.alt.forEach(id=>h+=nutCard(id,UI.alt,''));
 if(r.water&&(crop==='durian'||crop==='fruit'))h+=`<div class="card blue"><div class="leafrow">${leaf(FRUITWATER.leaf)}<h3>${t(FRUITWATER.title)}</h3></div><ul>${FRUITWATER.pts.map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`;
 return h;
}
function nutCard(id,lbl,cls){

 return `<div class="card ${cls} res"><div class="leafrow">${leaf(n.leaf)}<div><span class="tag g">${t(lbl)}</span><h3>${n.sym} · ${t(n.name)}</h3>${mobTag(n.mob)}<span class="muted">${t(n.where==='old'?UI.old:UI.young)}</span></div></div>
 <div class="kv"><b>${t(UI.defi)}</b><ul>${n.def.map(d=>`<li>${t(d)}</li>`).join('')}</ul><p class="muted"><b style="display:inline">${t(UI.phnote)}${C()}</b>${t(n.ph)}</p></div>
 <div class="kv"><b>${t(UI.doNow)}</b><div class="leafrow">${pic('spray')}<p><b>${t(UI.foliar)}</b>${t(n.foliar)}</p></div><div class="leafrow">${pic('soil')}<p><b>${t(UI.soil)}</b>${t(n.soil)}</p></div><div class="leafrow">${pic('compost')}<p><b>${t(UI.organic)}</b>${t(n.org)}</p></div></div></div>`;
}

/* --- Soil --- */
function renderSoil(){
 const ph=num(phVal),ec=num(ecVal);const phBad=phVal.trim()!==''&&isNaN(ph);const ecBad=ecVal.trim()!==''&&isNaN(ec);
 let phOut='';
 if(!isNaN(ph)&&ph>=2&&ph<=11){
  const [lo,hi]=CROPS_CFG[crop].ph;const band=PHTEXT[ph<lo-1?0:ph<lo?1:ph<=hi?2:ph<=hi+1?3:4];
  phOut=`<div class="card ${band.cls}"><b>pH ${ph.toFixed(1)}</b>${phScale(ph)}<p>${t(band.t)}</p></div>`+limeCard(ph,lo,hi)+`<div class="card"><b>${t(UI.avail)}</b>`;
  for(const id of ['N','P','K','Ca','Mg','S','Fe','Mn','Zn','Cu','B','Mo']){const a=interp(PHC[id],ph);phOut+=bar(lang==='zh'?`${id} ${t(N[id].name)}`:id,a,a<.4?'#9b1c1c':a<.7?'#c27a00':'#2e6b34');}
  const al=interp(PHC.AL,ph);phOut+=bar(t(UI.alrisk),al,al>.5?'#9b1c1c':al>.1?'#c27a00':'#2e6b34')+`</div>`;
 }else phOut=`${phScale(NaN)}<p class="muted">${t(phBad?UI.badNum:(!isNaN(ph)?UI.phRange:UI.noval))}</p>`;
 let ecOut='';
 if(!isNaN(ec)&&ec>=0){const d=ecUnit==='us'?ec/1000:ec;const bands=ecBands();const band=bands.find(b=>d<b.max)||bands[bands.length-1];ecOut=`<div class="card ${band.cls}"><b>${d.toFixed(2)} dS/m (${Math.round(d*1000)} µS/cm)</b>${ecMeth==='m15'?`<p><b>${t(UI.eceEst)} ${(d*EC15_F[tex]).toFixed(1)} dS/m</b> · ${t(UI.tex[tex])}</p>`:''}${ecScale(d,ecBands())}<p>${t(band.t).split('{crop}').join(t(UI.cropN[crop]))}</p>${ecMeth==='m15'?`<p class="muted">${t(UI.eceHow)}</p>`:''}</div>`;}
 else ecOut=`${ecScale(NaN,ecBands())}<p class="muted">${t(ecBad?UI.badNum:UI.noval)}</p>`;
 const t3=(items,cur,setter)=>`<div class="tiles t3">${items.map(([k,ic,l])=>`<button class="opt ${cur===k?'on':''}" onclick="${setter}='${k}';render()">${pic(ic)}<span>${typeof l==='string'?l:t(l)}</span></button>`).join('')}</div>`;
 const t2=(items,cur,setter)=>`<div class="tiles">${items.map(([k,ic,l])=>`<button class="opt ${cur===k?'on':''}" onclick="${setter}='${k}';render()">${pic(ic)}<span>${typeof l==='string'?l:t(l)}</span></button>`).join('')}</div>`;
 const phOut_=!isNaN(ph)&&(ph<CROPS_CFG[crop].ph[0]||ph>CROPS_CFG[crop].ph[1]);
 const texBlock=`<div id="texBlock"><label class="f">${t(UI.texture)}</label>${t3([['sand','sand',UI.tex.sand],['loam','loam',UI.tex.loam],['clay','clay',UI.tex.clay]],tex,'tex')}</div>`;
 const needG=ecMeth==='mpaste';
 return `${cropBar()}
 <h2>${t(UI.phTitle)}</h2><div class="card green"><b>${t(UI.targetGen)} · ${t(UI.cropN[crop])}: ${CROPS_CFG[crop].ph[0]}–${CROPS_CFG[crop].ph[1]}</b></div>
 <label class="f">${t(UI.phIn)}</label><input class="num" type="text" inputmode="decimal" value="${esc(phVal)}" oninput="phVal=this.value;renderSoilOnly()">
 <label class="f">${t(UI.phm)}</label>${t2([['probe','probe',UI.phprobe],['slurry','cup',UI.phslurry]],phMeth,'phMeth')}${phMeth==='probe'?`<div class="card amber"><p>${t(UI.probeNote)}</p></div>`:''}
 ${phOut_?texBlock:''}
 <div id="phOut">${phOut}</div>
 <h2 style="margin-top:1.2rem">${t(UI.ecTitle)}</h2>
 <label class="f">${t(UI.unit)}</label>${t2([['ds','unit_ds','dS/m (mS/cm)'],['us','unit_us','µS/cm']],ecUnit,'ecUnit')}
 <label class="f">${t(UI.ecIn)}</label><input class="num" type="text" inputmode="decimal" value="${esc(ecVal)}" oninput="ecVal=this.value;renderSoilOnly()">
 <label class="f">${t(UI.method)}</label>${t2([['mprobe','probe',UI.mprobe],['m15','cup',UI.m15],['mpaste','lab',UI.mpaste],['mpour','pot',UI.mpour],['mwater','water',UI.mwater]],ecMeth,'ecMeth')}
 ${ecMeth==='mprobe'?`<div class="card amber"><p>${t(UI.probeNote)}</p></div>`:''}
 ${ecMeth==='m15'&&!phOut_?texBlock:''}
 ${needG?(crop==='veg'?`<label class="f">${t(UI.cropG)}</label><div class="tiles t3">${[['s','margin',UI.gS,UI.gSx],['m','tomato',UI.gM,UI.gMx],['t','wheat',UI.gT,UI.gTx]].map(([k,ic,l,x])=>`<button class="opt ${cropG===k?'on':''}" onclick="cropG='${k}';render()">${pic(ic)}<span>${t(l)}<br><small style="font-weight:600">${t(x)}</small></span></button>`).join('')}</div>`:`<div class="card green"><span class="tag g">${t(UI.gFixed)}</span> <b>${t(UI.cropN[crop])} · ${t(cropG==='s'?UI.gS:cropG==='m'?UI.gM:UI.gT)}</b></div>`):''}
 <div id="ecOut">${ecOut}</div>
 ${cropTable()}
 <div class="sect">${t(UI.meters)}</div>${METERS.map(m=>`<details><summary>${pic(m.ic)}<span><span class="tag ${m.ok===true?'g':'a'}">${m.ok===true?'✓':'!'}</span>${t(m.title)}</span></summary><div class="body"><p>${t(m.t)}</p></div></details>`).join('')}
 <div class="sect">${t(UI.fieldTests)}</div>${TESTS.map(x=>`<details><summary>${pic(x.leaf)}<span>${t(x.title)}</span></summary><div class="body"><ul>${x.steps.map(s=>`<li>${t(s)}</li>`).join('')}</ul></div></details>`).join('')}`;
}
function ecBands(){if(ecMeth!=='mpaste')return ECB[ecMeth];const g=ECE_G[cropG];const f=ecMeth==='m15'?EC15_F[tex]:1;return ECB.mpaste_tpl.map((b,i)=>({...b,max:i<3?g[i]:Infinity}));}
function cropTable(){return `<details><summary>${leaf('margin')}<span>${t(UI.cropTbl)}</span></summary><div class="body"><p>${t(UI.cropIntro)}</p>${['s','m','t'].map(g=>`<p><b>${t(g==='s'?UI.gS:g==='m'?UI.gM:UI.gT)}</b></p><table class="tb">${CROPS.filter(c=>c.g===g).map(c=>`<tr><td>${t(c.n)}</td><td>${c.v}</td></tr>`).join('')}</table>`).join('')}<p class="muted">${t(CROPNOTE)}</p><p><b>${t(UI.feedIntro)}</b></p><table class="tb">${FEED.map(([n,v])=>`<tr><td>${t(n)}</td><td>${v}</td></tr>`).join('')}</table></div></details>`;}
function limeCard(ph,lo,hi){
 const f=(o,v)=>t(o).replace('{a}',ph.toFixed(1)).replace('{b}',v.toFixed(1)).replace('{tex}',t(UI.tex[tex]));
 if(ph<lo){const step=Math.min(lo,ph+1);const tt=(step-ph)*LIME_T[tex];return `<div class="card"><b>${t(UI.lime)}</b><p>${f(LIMETXT.need,step).replace('{t}',tt.toFixed(1))}${step<lo?` ${t(LIMETXT.more)}`:''}</p>${tt>1?`<p>${t(LIMETXT.split)}</p>`:''}<p>${t(LIMETXT.when)}</p><p class="muted">${t(LIMETXT.rough)}</p></div>`;}
 if(ph>hi){const tt=(ph-hi)*SULF_T[tex];return `<div class="card"><b>${t(UI.lime)}</b><p>${f(LIMETXT.down,hi).replace('{t}',tt.toFixed(2)).replace('{kg}',Math.round(tt*1000))}</p><p class="muted">${t(LIMETXT.rough)}</p></div>`;}
 return '';
}
function bar(n,a,c){return `<div class="bar"><span class="n">${n}</span><span class="t"><i style="width:${Math.round(a*100)}%;background:${c}"></i></span><span class="v">${Math.round(a*100)}%</span></div>`;}
function renderSoilOnly(){ /* re-render only result blocks so inputs keep focus */
 const tmp=document.createElement('div');tmp.innerHTML=renderSoil();
 const hadTex=!!document.querySelector('#view #texBlock');const hasTex=!!tmp.querySelector('#texBlock');
 if(hadTex!==hasTex){const a=document.activeElement;const v=a&&a.value;const isPh=a&&a.getAttribute('oninput')&&a.getAttribute('oninput').startsWith('phVal');render();const inp=document.querySelectorAll('#view input.num')[isPh?0:1];if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}return;}
 $('#phOut').innerHTML=tmp.querySelector('#phOut').innerHTML;$('#ecOut').innerHTML=tmp.querySelector('#ecOut').innerHTML;
}

/* --- Reference --- */
function renderRef(){
 return `<h2>${t(UI.antag)}</h2>`+ANTAG.map(a=>`<div class="card">${seesaw(a.hi,a.lo.join(' '))}<p>${t(a.t)}</p></div>`).join('')+
 `<div class="sect">${t(UI.tox)}</div>`+TOX.map(x=>`<details><summary>${pic(x.art)}<span>${t(x.title)}</span></summary><div class="body"><div class="art">${pic(x.art)}</div><p>${t(x.t)}</p></div></details>`).join('')+
 `<div class="sect">${t(UI.look)}</div>`+LOOK.map(x=>`<details><summary>${pic(x.art)}<span>${t(x.title)}</span></summary><div class="body"><div class="art">${pic(x.art)}</div><p>${t(x.t)}</p></div></details>`).join('')+
 `<div class="sect">${t(UI.healthy)}</div><div class="card green"><div class="leafrow">${pic('healthyTree')}<b>${t(UI.healthy)}</b></div><ul>${HEALTHY.map(h=>`<li>${t(h)}</li>`).join('')}</ul></div>`+
 `<div class="sect">${t(UI.limits)}</div><div class="card"><div class="art">${pic('sprayTest')}</div><ul>${LIMITS.map(h=>`<li>${t(h)}</li>`).join('')}</ul></div>`+
 `<div class="sect">${t(UI.feedNow)}</div>`+feedCard()+(crop==='palm'?palmCard():'')+
 ((crop==='durian'||crop==='fruit')?`<div class="sect">${t(NPK.title)}</div>`+npkCard():'')+
 `<div class="sect">${t(UI.sources)}</div><details><summary>${t(UI.sources)}</summary><div class="body"><ul>${SOURCES.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a></li>`).join('')}</ul></div></details>`+`<div class="sect">${t(UI.shareApp)}</div>`+shareCard();
}

/* ============ PWA ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}

document.getElementById('langArt').innerHTML=leaf('interV');
/* ============ boot ============ */
if(lang){document.documentElement.lang=lang==='zh'?'zh':lang==='bm'?'ms':'en';$('#langScreen').style.display='none';$('#app').style.display='block';render();}
</script>
</body>
</html>
