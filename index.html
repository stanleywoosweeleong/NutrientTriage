<style>
:root{--fs:18px;--ink:#14201a;--ink2:#2b3a31;--bg:#f1efe6;--card:#fbf9f2;--line:#c9d3c6;--green:#2e6b34;--green2:#e3efdf;--amber:#9a5a00;--amber2:#fff1d6;--red:#9b1c1c;--red2:#fde3e3;--blue:#1d4f8a;--blue2:#e1ecf8;--r:10px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;color:var(--ink);background:var(--bg);font-weight:600;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
h1,h2,h3{margin:0 0 .4rem;line-height:1.25}
h2{font-size:1.35rem;font-weight:800;color:var(--green)}
h3{font-size:1.15rem;font-weight:800}
p{margin:.3rem 0}
ul{margin:.3rem 0 .3rem 1.2rem;padding:0}
li{margin:.2rem 0}
/* language screen */
#langScreen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem 1.5rem;gap:.3rem;text-align:center;box-sizing:border-box}
#langScreen .big{font-size:1.8rem;font-weight:800;color:var(--green);margin-top:.2rem}
#langScreen .mid{font-size:1.1rem;font-weight:600;color:var(--ink2)}
#langScreen .btns{display:flex;flex-direction:column;gap:.6rem;width:100%;max-width:340px;margin-top:1rem}
#langScreen .btns button{padding:.75rem;font-size:1.25rem;font-weight:700;border:2px solid var(--green);background:var(--card);border-radius:var(--r)}
#langScreen .btns button:active{background:var(--green2)}
/* app shell */
#app{display:none;min-height:100vh;padding-bottom:calc(4.6rem + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;padding-top:calc(.55rem + env(safe-area-inset-top))}
header h1{flex:1;font-size:1.3rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:8px;padding:.3rem .6rem;font-weight:700;min-width:3rem}
main{padding:.9rem .8rem 1rem;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1.5px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:.5rem .2rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.95rem;font-weight:800;color:var(--ink2)}
nav button{margin:.3rem .25rem;border-radius:8px}
nav button.on{background:var(--green);color:#fff}
nav svg{width:1.7rem;height:1.7rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;margin-bottom:.8rem}
.card.green{border-color:var(--green);background:var(--green2)}
.card.amber{border-color:var(--amber);background:var(--amber2)}
.card.red{border-color:var(--red);background:var(--red2)}
.card.blue{border-color:var(--blue);background:var(--blue2)}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:6px;font-size:.92rem;font-weight:800;margin-right:.3rem;vertical-align:middle}
.tag.m{background:#e8d9ff;color:#4b2a8a}.tag.i{background:#d9ecff;color:#1d4f8a}.tag.x{background:#ffe0c2;color:#8a4a00}
.tag.g{background:var(--green2);color:var(--green)}.tag.r{background:var(--red2);color:var(--red)}.tag.a{background:var(--amber2);color:var(--amber)}
.muted{color:var(--ink);font-size:1rem;font-weight:500}
.row{display:flex;gap:.6rem;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.opt{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:.6rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;font-weight:800;font-size:1.05rem;line-height:1.3}
.opt:active{background:var(--green2);border-color:var(--green)}
.opt svg{width:6rem;height:6rem}
.opt.wide{grid-column:1/-1;flex-direction:row;text-align:left}
.opt.on{border-color:var(--green);background:var(--green2);color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:.3rem 0 .6rem}
.tiles .opt svg{width:100%;max-width:4.5rem;height:auto;aspect-ratio:90/114}
.opt{min-width:0}
.opt span{overflow-wrap:break-word;max-width:100%}
.tiles .opt{font-size:1rem;padding:.5rem .4rem}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.t4 .opt{font-size:.9rem;padding:.4rem .2rem}
.art{display:flex;justify-content:center;margin:.5rem 0}
.art svg{width:9rem;height:9rem}
.btn{border:2px solid var(--green);background:var(--card);color:var(--green);border-radius:8px;padding:.5rem .9rem;font-weight:800}
.btn.fill{background:var(--green);color:#fff}
.btn.sm{padding:.3rem .6rem;font-size:.9rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0 .6rem}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:.45rem .75rem;font-weight:800}
.seg button.on{border-color:var(--green);background:var(--green2);color:var(--green)}
.crumbs{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem}
.crumbs span{background:var(--green2);color:var(--green);border-radius:6px;padding:.1rem .5rem;font-weight:700;font-size:.9rem}
.crumbs{align-items:center}
#result{scroll-margin-top:4.5rem;margin-top:.8rem}
#shareDlg{position:fixed;inset:0;z-index:20;background:rgba(20,32,26,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top) 0 0}
#shareDlg[hidden]{display:none}
.dlg{background:var(--card);border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;gap:.5rem;padding:1rem .9rem calc(.9rem + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.dlg h3{margin:0}
#shareText{flex:1;min-height:10rem;font:inherit;font-size:1rem;font-weight:500;line-height:1.45;padding:.6rem;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
#shareText:focus{outline:none;border-color:var(--green)}
.crumbs i{font-style:normal;color:var(--ink2);font-weight:800}
.chip{border:2px solid var(--green);background:var(--card);color:var(--green);border-radius:8px;padding:.3rem .6rem;font-weight:800;font-size:.95rem}
.chip.cur{background:var(--green);color:#fff}
.lnk{color:var(--green);font-weight:800;text-decoration:underline;text-underline-offset:3px}
details{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:.6rem}
details summary{list-style:none;padding:.7rem .8rem;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.6rem;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";margin-left:auto;color:var(--green);font-weight:700}
details[open] summary::after{content:"－"}
details .body{padding:0 .9rem .8rem;border-top:1.5px solid var(--line)}
details summary svg{width:4.2rem;height:4.2rem;flex:none}
details summary>span{min-width:0;overflow-wrap:anywhere}
details{overflow:hidden}
label.f{display:block;font-weight:800;margin:.4rem 0 .2rem}
input.num{width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:.5rem .7rem;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input.num:focus{outline:none;border-color:var(--green)}
.bar{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}
.bar .n{width:5.2rem;font-weight:700;flex:none}
.bar .t{flex:1;height:1rem;background:#e4e8e1;border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .v{width:2.8rem;text-align:right;font-weight:700;font-size:.9rem}
.sect{margin:1rem 0 .5rem;font-size:1.15rem;font-weight:700;color:var(--green)}
.res h3{color:var(--green)}
.tb{border-collapse:collapse;width:100%;margin:.4rem 0;font-size:1rem}.tb th,.tb td{border:1.5px solid var(--line);padding:.3rem .4rem;text-align:left}.tb th{background:var(--green2);color:var(--green)}
a{color:var(--blue);font-weight:600;word-break:break-all}
.kv{margin:.4rem 0}
.kv b{display:block;font-weight:800}
.leafrow{display:flex;gap:.5rem;align-items:center}
.leafrow svg{width:6.5rem;height:6.5rem;flex:none}
.kv .leafrow svg,.body .leafrow svg{width:4.5rem;height:4.5rem}
.leafrow p{margin:.2rem 0}
.leafrow p b{display:block}
footer.note{font-size:.95rem;font-weight:500;color:var(--ink2);padding:1rem .3rem 0}
</style>
</head>

<script>
/* ============ i18n ============ */
const _=(zh,en,bm)=>({zh,en,bm});
let lang=localStorage.getItem('nt_lang')||null;if(lang&&!['zh','en','bm'].includes(lang))lang=null;
let fsIdx=+(localStorage.getItem('nt_fs')||0);if(!(fsIdx>=0&&fsIdx<3))fsIdx=0;
const FS=[18,21,24];
const t=o=>typeof o==='string'?o:(o[lang]||o.en);
const LANGLBL={zh:'中文',en:'EN',bm:'BM'};
const LANGORDER=['zh','en','bm'];

const UI={
 title:_('养分辨症','Nutrient Triage','Triaj Nutrien'),
 nav:[_('辨症','Diagnose','Diagnosis'),_('养分','Nutrients','Nutrien'),_('土壤','Soil','Tanah'),_('参考','Reference','Rujukan')],
 where:_('症状最先出现在哪里？','Where did the symptoms appear first?','Di mana simptom mula muncul?'),
 pattern:_('叶片是什么样子？','What does the leaf look like?','Bagaimana rupa daun?'),
 back:_('返回','Back','Kembali'),restart:_('重新开始','Start again','Mula semula'),
 likely:_('最可能','Most likely','Paling mungkin'),alt:_('也可能','Also possible','Mungkin juga'),
 tell:_('如何区分','How to tell apart','Cara membezakan'),rule:_('先排除','Rule out first','Ketepikan dahulu'),
 doNow:_('现在怎么做','What to do now','Apa perlu dibuat sekarang'),
 foliar:_('叶面喷施（快速）','Foliar spray (fast)','Semburan daun (cepat)'),
 soil:_('土壤施用（长期）','Soil application (long term)','Pemberian ke tanah (jangka panjang)'),
 checkSoil:_('同时检查土壤 pH 和 EC——很多缺素其实是 pH 造成的养分锁定，不是土里没有。','Also check soil pH and EC — many "deficiencies" are pH lock-out, not an empty soil.','Semak juga pH dan EC tanah — banyak "kekurangan" sebenarnya nutrien terkunci oleh pH, bukan tanah kosong.'),
 goSoil:_('去土壤页','Go to Soil','Ke halaman Tanah'),
 notNutrient:_('这不是缺素','This is not a nutrient problem','Ini bukan masalah nutrien'),
 mobile:_('可移动','Mobile','Mudah alih'),immobile:_('不可移动','Immobile','Tidak mudah alih'),inter:_('半移动','Semi-mobile','Separa mudah alih'),
 old:_('老叶先出现','Old leaves first','Daun tua dahulu'),young:_('新叶先出现','Young leaves first','Daun muda dahulu'),

 phnote:_('pH 关系','pH link','Kaitan pH'),
 phTitle:_('土壤 pH','Soil pH','pH tanah'),ecTitle:_('土壤 EC（盐分）','Soil EC (salts)','EC tanah (garam)'),
 phIn:_('输入测得的 pH','Enter measured pH','Masukkan pH yang diukur'),
 ecIn:_('输入测得的 EC','Enter measured EC','Masukkan EC yang diukur'),
 unit:_('单位','Unit','Unit'),method:_('测量方法','Method','Kaedah'),
 mprobe:_('直插式土壤仪','Direct-insert soil probe','Prob tanah cucuk terus'),m15:_('土:水 1:5 浸提','Soil:water 1:5 slurry','Larutan tanah:air 1:5'),mpaste:_('饱和浸提液 ECe','Saturated paste ECe','Pes tepu ECe'),
 phm:_('pH 测量方法','pH method','Kaedah pH'),phprobe:_('直插式 pH 仪','Direct-insert pH meter','Meter pH cucuk terus'),phslurry:_('土:水 1:2.5 浸提 + pH 笔','Soil:water 1:2.5 + pH pen','Tanah:air 1:2.5 + pen pH'),
 probeNote:_('直插式仪表只在土壤湿润时准确——雨后或浇水后约 24 小时测，干土读数会偏低（EC）或乱跳（pH）。插入 10–15 cm，同一棵树测 3–5 点取中间值；读数接近分界线时用浸提法复核。','Direct-insert meters are only accurate in moist soil — measure about 24 h after rain or irrigation; dry soil reads low (EC) or drifts (pH). Insert 10–15 cm, take 3–5 readings per tree and use the middle value; near a boundary, confirm with the slurry method.','Meter cucuk terus hanya tepat dalam tanah lembap — ukur kira-kira 24 jam selepas hujan atau pengairan; tanah kering membaca rendah (EC) atau tidak stabil (pH). Cucuk 10–15 cm, ambil 3–5 bacaan sepokok dan guna nilai tengah; hampir sempadan, sahkan dengan kaedah larutan.'),
 cropG:_('作物耐盐组','Crop salt-tolerance group','Kumpulan toleransi garam tanaman'),

 gS:_('敏感','Sensitive','Sensitif'),gM:_('中等','Moderate','Sederhana'),gT:_('耐盐','Tolerant','Toleran'),

 gFixed:_('耐盐组由作物决定','Tolerance group set by crop','Kumpulan toleransi ditetapkan oleh tanaman'),
 cropTbl:_('各种作物的盐分耐受 (ECe) 与肥液 EC','Salt tolerance (ECe) and feed EC by crop','Toleransi garam (ECe) dan EC larutan baja mengikut tanaman'),
 cropIntro:_('ECe = 饱和浸提液电导率，dS/m。表中数字是产量「开始下降」的门槛（Maas–Hoffman / FAO），不是最佳值——作物在这个数以下才舒服。1:5 读数要乘以质地系数才能对照这张表（沙土 ×15、壤土 ×10、黏土 ×7，土壤页会自动换算）；直插式读数随含水量变化，只看趋势。','ECe = saturated-paste extract EC in dS/m. The figures are the threshold where yield *starts* to fall (Maas–Hoffman / FAO), not an optimum — the crop is comfortable below them. A 1:5 reading must be multiplied by a texture factor before comparing with this table (sand ×15, loam ×10, clay ×7 — the Soil page does this for you); probe readings move with moisture and are for trends only.','ECe = EC ekstrak pes tepu dalam dS/m. Angka ialah ambang di mana hasil *mula* menurun (Maas–Hoffman / FAO), bukan optimum — tanaman selesa di bawahnya. Bacaan 1:5 mesti didarab dengan faktor tekstur sebelum dibandingkan dengan jadual ini (pasir ×15, lom ×10, liat ×7 — halaman Tanah mengiranya untuk anda); bacaan prob berubah dengan kelembapan dan untuk trend sahaja.'),
 feedIntro:_('水培 / 滴灌肥液 EC (dS/m)——这才是「最佳值」，是配肥时要调到的浓度。果树土栽没有这种肥液标准，看土壤 1:5 在 0.15–0.4 即可。','Hydroponic / fertigation feed EC (dS/m) — this one *is* an optimum, the strength to mix the feed to. Fruit trees in soil have no feed standard; aim for soil 1:5 EC of 0.15–0.4.','EC larutan hidroponik / fertigasi (dS/m) — ini memang optimum, kepekatan yang perlu dicampur. Pokok buah di tanah tiada piawai larutan; sasarkan EC tanah 1:5 pada 0.15–0.4.'),
 cropLbl:_('作物','Crop','Tanaman'),
 cropN:{durian:_('榴莲','Durian','Durian'),fruit:_('其他果树','Other fruit','Buah lain'),veg:_('蔬菜','Veg','Sayur'),palm:_('油棕','Oil palm','Kelapa sawit')},
 ctxQ:_('最近两周有没有这些情况？（可多选，没有就跳过）','Anything in the last 2 weeks? (tap all that apply, or skip)','Ada perkara ini dalam 2 minggu lepas? (pilih semua yang berkenaan, atau langkau)'),

/* ============ leaf illustrations ============ */
let _lid=0;
function leaf(type){
 const G='#3d8b3d',G2='#2f6f2f',Y='#e8d44a',Y2='#f3e68a',B='#8a4a1a',P='#5a4a6a',DG='#2a5e2a';
 /* nicer leaf: pointed tip, full blade, petiole, curved veins */
 const O='M45 4 C63 17 76 40 74 64 C72 87 58 101 45 108 C32 101 18 87 16 64 C14 40 27 17 45 4 Z';
 const edge=y=>29*Math.pow(Math.sin(Math.PI*(y-4)/104),0.75);
 const ys=[24,38,52,66,80,92];
 const veinPath=(y,side)=>{const e=edge(y+14)*side;return `M45 ${y} C${45+side*8} ${y+3} ${45+e*0.55} ${y+8} ${45+e*0.95} ${y+14}`;};
 const veins=(w,c,op=1)=>ys.map(y=>`<path d="${veinPath(y,-1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${op}"/><path d="${veinPath(y,1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${op}"/>`).join('');
 const mid=(c=DG)=>`<path d="M45 8 L45 106" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M45 8 L45 60" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
 const petiole=`<path d="M45 106 L45 112" stroke="#6b4a2a" stroke-width="3.5" stroke-linecap="round"/>`;
 const id='lg'+(_lid++);
 const shade=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient><clipPath id="${id}c"><path d="${O}"/></clipPath></defs><path d="${O}" fill="url(#${id})"/>`;
 const base=(fill)=>`<path d="${O}" fill="${fill}"/>${shade}`;
 const clip=inner=>`<g clip-path="url(#${id}c)">${inner}</g>`;
  const lf=(x,y,sc,c,r,stroke='')=>`<path d="${O}" fill="${c}" ${stroke} transform="translate(${x-45*sc},${y-56*sc}) scale(${sc}) rotate(${r} 45 56)"/>`;
 const canopy=(cx,cy,c1,c2,sc=1)=>[[-24,2,-75],[24,2,75],[-15,-16,-40],[15,-16,40],[0,-22,0],[-22,18,-105],[22,18,105],[0,-4,0]].map(([dx,dy,r],i)=>lf(cx+dx*sc,cy+dy*sc,.36*sc,i%2?c1:c2,r)).join('');
 const durian=(cx,cy,r,c='#b9a94c',c2='#9a8a34')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>${Array.from({length:22},(_,i)=>{const a=i/22*Math.PI*2,x=cx+r*0.96*Math.cos(a),y=cy+r*0.96*Math.sin(a);return `<path d="M${x-3*Math.sin(a)} ${y+3*Math.cos(a)} L${cx+(r+8)*Math.cos(a)} ${cy+(r+8)*Math.sin(a)} L${x+3*Math.sin(a)} ${y-3*Math.cos(a)} Z" fill="${c2}"/>`;}).join('')}${Array.from({length:14},(_,i)=>{const a=i/14*Math.PI*2+.2,x=cx+r*0.55*Math.cos(a),y=cy+r*0.55*Math.sin(a);return `<path d="M${x-2.5*Math.sin(a)} ${y+2.5*Math.cos(a)} L${x+6*Math.cos(a)} ${y+6*Math.sin(a)} L${x+2.5*Math.sin(a)} ${y-2.5*Math.cos(a)} Z" fill="${c2}" opacity=".8"/>`;}).join('')}`;
 const trunkP=(x1,y1,x2,w)=>`<path d="M${x1} ${y1} L${x2} ${y1-w*0.2}" stroke="#6b4a2a" stroke-width="${w}" stroke-linecap="round"/>`;
 let body='';
 switch(type){
  case 'healthy': body=`${base(G)}${veins(1.6,DG)}${mid()}${petiole}`;break;
  case 'uniform': body=`${base(Y)}${veins(1.6,'#c9b840')}${mid('#b8a830')}${petiole}`;break;
  case 'interV': /* Mg: yellow between veins, green wedges along midrib & veins (Christmas tree) */
   body=`${base(Y)}${clip(`<path d="M45 8 C55 40 57 72 48 104 L45 108 L42 104 C33 72 35 40 45 8 Z" fill="${G}"/>`+ys.map(y=>[-1,1].map(sd=>`<path d="M45 ${y-3} C${45+sd*10} ${y+1} ${45+sd*edge(y+14)*0.6} ${y+6} ${45+sd*edge(y+14)*0.92} ${y+13} C${45+sd*edge(y+14)*0.6} ${y+11} ${45+sd*10} ${y+8} 45 ${y+5} Z" fill="${G}"/>`).join('')).join(''))}${veins(1.4,DG)}${mid()}${petiole}`;break;
  case 'interFine': /* Fe: pale yellow, fine green vein network on youngest leaf */
   body=`${base(Y2)}${clip(veins(2.2,G)+[31,45,59,73,86].map(y=>`<path d="${veinPath(y,-1)}" stroke="${G}" stroke-width="1" fill="none" opacity=".8"/><path d="${veinPath(y,1)}" stroke="${G}" stroke-width="1" fill="none" opacity=".8"/>`).join('')+ys.map(y=>[-1,1].map(sd=>`<path d="M${45+sd*6} ${y+6} L${45+sd*14} ${y+16} M${45+sd*12} ${y+4} L${45+sd*20} ${y+12}" stroke="${G}" stroke-width=".9" opacity=".7"/>`).join('')).join(''))}${mid(G)}${petiole}`;break;
  case 'interCoarse': /* Mn: yellow, broad green bands along veins, small brown spots */
   body=`${base(Y)}${clip(veins(7,G,0.9))}${veins(1.4,DG)}${mid()}${[[31,48],[59,44],[34,70],[58,74],[42,88]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.4" fill="${B}"/>`).join('')}${petiole}`;break;
  case 'margin': /* K: green centre, yellow then brown scorched margin */
   body=`${base(G)}<path d="${O}" fill="none" stroke="${Y}" stroke-width="13"/><path d="${O}" fill="none" stroke="${B}" stroke-width="7"/><path d="${O}" fill="none" stroke="#5a2e0e" stroke-width="2" opacity=".6"/>${veins(1.6,DG)}${mid()}${petiole}`;break;
  case 'tip': /* Ca: green leaf, burnt distorted tip */
   body=`${base(G)}<path d="M45 4 C58 14 68 30 71 48 C62 46 52 50 45 46 C38 50 28 46 19 48 C22 30 32 14 45 4 Z" fill="${B}"/><path d="M45 4 C50 12 56 24 58 36" stroke="#5a2e0e" stroke-width="1.5" fill="none"/><path d="M45 4 L38 -2 M45 4 L52 -1" stroke="${B}" stroke-width="2.5" stroke-linecap="round"/>${veins(1.6,DG)}${mid()}${petiole}`;break;
  case 'purple': body=`${base(DG)}<path d="${O}" fill="${P}" opacity=".55"/>${veins(1.6,'#1b3a1b')}${mid('#1b3a1b')}${petiole}`;break;
  case 'spots': body=`${base(G)}${veins(1.6,DG)}${mid()}${[[30,40],[58,34],[36,66],[55,70],[44,86],[60,52],[26,56]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.4" fill="${B}"/><circle cx="${x}" cy="${y}" r="1.4" fill="#5a2e0e"/>`).join('')}${petiole}`;break;
  case 'small': body=`<path d="M45 110 L45 46" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/>${[[45,46,0],[31,58,-55],[59,58,55],[34,74,-50],[56,74,50],[38,90,-45],[52,90,45]].map(([x,y,r])=>`<path d="${O}" fill="${Y2}" stroke="${G}" stroke-width="3" transform="translate(${x-45*.26},${y-4}) scale(.26) rotate(${r} 45 56)"/>`).join('')}`;break;
  case 'dieback': body=`<path d="M45 112 L45 44" stroke="#6b4a2a" stroke-width="5" stroke-linecap="round"/><path d="M45 44 C46 34 44 24 45 10" stroke="${B}" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M45 10 L39 2 M45 10 L52 3" stroke="${B}" stroke-width="2.5" stroke-linecap="round"/><path d="M45 44 L30 30 M45 48 L62 34 M45 52 L34 40" stroke="#8fb36a" stroke-width="3" stroke-linecap="round"/>${lf(28,26,.26,'#b7dc8a',-50)}${lf(64,30,.26,'#b7dc8a',50)}${lf(32,36,.22,'#b7dc8a',-60)}${lf(22,74,.42,G,-55)}${lf(68,80,.42,G,55)}${lf(45,22,.28,B,0)}`;break;
  case 'twist': body=`<path d="M45 112 L45 56" stroke="#6b4a2a" stroke-width="5" stroke-linecap="round"/><path d="M45 56 C28 46 62 32 42 16 C36 10 50 2 58 10" stroke="#7aa05a" stroke-width="4.5" fill="none" stroke-linecap="round"/>${lf(70,56,.36,G,80)}${lf(16,40,.34,'#a7c97a',-120)}${lf(56,30,.26,'#cfe3a8',150)}${lf(40,8,.2,'#cfe3a8',-160)}<circle cx="50" cy="46" r="3" fill="#d9862a"/><circle cx="40" cy="30" r="2.5" fill="#d9862a"/>`;break;
  case 'fruit': body=`<path d="M45 24 L45 4" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/>${durian(45,62,32)}<path d="M30 48 C38 56 36 66 42 74 C44 78 38 84 40 90" stroke="${B}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M30 48 C38 56 36 66 42 74 C44 78 38 84 40 90" stroke="#f1e2a0" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="58" cy="52" r="5" fill="#8a6a2a"/><circle cx="56" cy="70" r="4" fill="#8a6a2a"/>`;break;
  case 'fruit2': body=`<path d="M45 24 L45 4" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/>${durian(45,60,30)}<path d="M20 94 L13 110 M31 94 L29 110 M59 94 L61 110 M70 94 L77 110" stroke="${B}" stroke-width="3" stroke-linecap="round"/><path d="M8 110 L24 100 M36 110 L30 100 M54 110 L60 100 M82 110 L72 100" stroke="${B}" stroke-width="3" stroke-linecap="round"/>`;break;
  case 'tree': body=`<rect x="0" y="100" width="90" height="14" fill="#8c6a48"/><path d="M0 100 Q45 92 90 100 L90 103 Q45 95 0 103 Z" fill="#5c9a3c"/><path d="M45 102 L45 58" stroke="#6b4a2a" stroke-width="7" stroke-linecap="round"/>${trunkP(45,74,28,4)}${trunkP(45,68,62,4)}${canopy(45,44,Y,'#d4bf3a')}`;break;
  case 'treeWilt': body=`<rect x="0" y="100" width="90" height="14" fill="#6b5236"/><path d="M0 100 Q45 92 90 100 L90 103 Q45 95 0 103 Z" fill="#4e8fd0" opacity=".8"/><path d="M45 102 L45 50" stroke="#6b4a2a" stroke-width="7" stroke-linecap="round"/>${[[22,58,-160],[68,58,160],[30,40,-150],[60,40,150],[45,34,180],[20,78,-165],[70,78,165]].map(([x,y,r])=>lf(x,y,.38,'#8aa86a',r)).join('')}`;break;
  case 'treeDark': body=`<rect x="0" y="100" width="90" height="14" fill="#8c6a48"/><path d="M0 100 Q45 92 90 100 L90 103 Q45 95 0 103 Z" fill="#5c9a3c"/><path d="M45 102 L45 70" stroke="#6b4a2a" stroke-width="6" stroke-linecap="round"/>${canopy(45,62,DG,'#244e24',.75)}`;break;
  case 'trunk': body=`<path d="M28 108 L33 6 L57 6 L62 108 Z" fill="#8c6a48"/><path d="M33 6 L36 108 M52 6 L50 108" stroke="#6b4a2a" stroke-width="2" opacity=".6"/>${[18,34,50,66,82,98].map(y=>`<path d="M31 ${y} Q45 ${y+3} 59 ${y}" stroke="#6b4a2a" stroke-width="1.2" fill="none" opacity=".7"/>`).join('')}<path d="M40 38 C36 52 44 62 40 78 C38 86 44 92 42 100" stroke="#2a1a0e" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M43 56 C50 66 46 80 54 92 C56 96 52 100 56 106" stroke="#d9862a" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="56" cy="106" r="4" fill="#d9862a"/>`;break;
  case 'root': body=`<rect x="0" y="34" width="90" height="80" fill="#7a5a3a"/><path d="M0 34 Q45 26 90 34 L90 38 Q45 30 0 38 Z" fill="#5c9a3c"/><path d="M45 2 L45 36" stroke="#6b4a2a" stroke-width="8" stroke-linecap="round"/><path d="M45 34 C40 50 30 56 22 76 M45 34 C50 50 60 56 68 76 M45 34 L45 84 M22 76 C18 86 16 94 14 102 M68 76 C72 86 74 94 76 102" stroke="#4a2e14" stroke-width="5" fill="none" stroke-linecap="round"/>${[[36,56,-20],[54,56,20],[30,68,-30],[60,68,30],[40,74,-10],[50,74,10]].map(([x,y,r])=>`<path d="M${x} ${y} l${r/3} 8" stroke="#2a1a0e" stroke-width="2" stroke-linecap="round"/>`).join('')}<path d="M0 96 Q45 86 90 96 L90 114 L0 114 Z" fill="#4e8fd0" opacity=".75"/><path d="M8 100 Q20 96 32 100 M50 101 Q62 97 74 101" stroke="#fff" stroke-width="1.5" fill="none" opacity=".6"/>`;break;
  case 'shoot': body=`<path d="M45 112 C44 80 46 50 45 10" stroke="#8fb36a" stroke-width="3.5" fill="none" stroke-linecap="round"/>${[[45,12,0],[52,34,40],[38,54,-40],[52,74,40],[38,94,-40]].map(([x,y,r])=>lf(x+(r>0?6:r<0?-6:0),y,.26,'#b7dc8a',r)).join('')}`;break;
  case 'flower': body=`<path d="M45 112 L45 48" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/><path d="M45 60 L30 44 M45 64 L60 50" stroke="#6b4a2a" stroke-width="3" stroke-linecap="round"/>${[[30,44],[60,50],[45,48]].map(([x,y])=>`${[0,72,144,216,288].map(a=>`<ellipse cx="${x}" cy="${y-9}" rx="4.5" ry="10" fill="#f6e9c6" stroke="#d9c58a" stroke-width=".8" transform="rotate(${a} ${x} ${y})"/>`).join('')}${[0,60,120,180,240,300].map(a=>`<path d="M${x} ${y} L${x+6*Math.cos(a*Math.PI/180)} ${y+6*Math.sin(a*Math.PI/180)}" stroke="#d9a441" stroke-width="1.2"/><circle cx="${x+6*Math.cos(a*Math.PI/180)}" cy="${y+6*Math.sin(a*Math.PI/180)}" r="1.4" fill="#c98a1a"/>`).join('')}<circle cx="${x}" cy="${y}" r="2.5" fill="#e3b24a"/>`).join('')}<path d="M26 86 L20 102 M34 92 L31 108 M62 90 L68 106" stroke="#c9a65a" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="103" r="2.5" fill="#c9a65a"/><circle cx="31" cy="109" r="2.5" fill="#c9a65a"/><circle cx="68" cy="107" r="2.5" fill="#c9a65a"/>`;break;
  case 'healthyTreeX': body=`<rect x="0" y="100" width="90" height="14" fill="#8c6a48"/><path d="M0 100 Q45 92 90 100 L90 103 Q45 95 0 103 Z" fill="#5c9a3c"/><path d="M45 102 L45 56" stroke="#6b4a2a" stroke-width="7" stroke-linecap="round"/>${trunkP(45,74,28,4)}${trunkP(45,68,62,4)}${canopy(45,42,G,'#2a5e2a')}`;break;
  case 'saplingX': body=`<rect x="0" y="92" width="90" height="22" fill="#8c6a48"/><path d="M0 92 Q45 84 90 92 L90 95 Q45 87 0 95 Z" fill="#5c9a3c"/><path d="M45 94 L45 40" stroke="#8fb36a" stroke-width="4" stroke-linecap="round"/>${lf(28,52,.3,'#9fcf7a',-50)}${lf(62,58,.3,'#9fcf7a',50)}${lf(45,30,.32,'#b7dc8a',0)}${lf(34,72,.26,'#9fcf7a',-60)}`;break;
  case 'salt': body=`${base(G)}<path d="${O}" fill="none" stroke="${Y}" stroke-width="14"/><path d="${O}" fill="none" stroke="${B}" stroke-width="9"/>${veins(1.6,DG)}${mid()}${petiole}${[[10,96],[18,104],[26,98],[70,100],[78,94],[84,104]].map(([x,y])=>`<rect x="${x}" y="${y}" width="5" height="5" fill="#fff" stroke="#8aa0b4" stroke-width="1" transform="rotate(20 ${x} ${y})"/>`).join('')}`;break;
  default: body=`${base(G)}${mid()}${petiole}`;
 }
 return `<svg viewBox="0 0 90 114" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

/* ============ pictograms (language-neutral) ============ */
function pic(n){
 const W='#5a3a1f',G='#3d8b3d',B='#1d4f8a',Y='#e6d04a',R='#9b1c1c';
 const O='M45 6 C76 26 80 72 45 106 C10 72 14 26 45 6 Z';
 const svg=b=>`<svg viewBox="0 0 90 112" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
 const mid='<path d="M45 10 L45 102" stroke="#2a5e2a" stroke-width="2.5"/>';
 switch(n){
  case 'jar': return svg(`<path d="M22 20 L22 100 Q22 106 28 106 L62 106 Q68 106 68 100 L68 20 Z" fill="#eef5ff" stroke="#55708a" stroke-width="3"/><rect x="18" y="12" width="54" height="10" rx="3" fill="#8aa0b4"/><rect x="24" y="86" width="42" height="18" fill="#c9a86a"/><rect x="24" y="68" width="42" height="18" fill="#a88a5a"/><rect x="24" y="52" width="42" height="16" fill="#7a5a3a"/><rect x="24" y="34" width="42" height="18" fill="#cfe3f5"/>`);

  case 'cup': return svg(`<path d="M18 30 L24 100 Q24 106 30 106 L60 106 Q66 106 66 100 L72 30 Z" fill="#fff" stroke="#55708a" stroke-width="3"/><path d="M22 60 L26 98 Q26 102 30 102 L60 102 Q64 102 64 98 L68 60 Z" fill="#b89a6a"/><rect x="48" y="4" width="10" height="70" rx="3" fill="#2b3a31" transform="rotate(20 53 39)"/><rect x="50" y="8" width="6" height="14" fill="#9fd" transform="rotate(20 53 39)"/>`);
  case 'worm': return svg(`<rect x="0" y="50" width="90" height="62" fill="#5a3a1f"/><path d="M8 85 C20 60 30 110 42 85 C54 60 64 110 80 80" stroke="#d98a8a" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="80" cy="80" r="5" fill="#c86a6a"/><path d="M0 50 Q45 40 90 50 L90 52 Q45 44 0 52 Z" fill="#5c9a3c"/><path d="M25 48 L25 30 M45 46 L45 24 M65 48 L65 32" stroke="#5c9a3c" stroke-width="4"/>`);
  case 'leaves3': return svg(`<path d="${O}" fill="#e0c43a" transform="translate(2,30) scale(.42)"/><path d="${O}" fill="#9fc24a" transform="translate(27,22) scale(.46)"/><path d="${O}" fill="${G}" transform="translate(54,14) scale(.5)"/>`);
  case 'probe': return svg(`<rect x="0" y="70" width="90" height="42" fill="#8c6a48"/><rect x="30" y="4" width="30" height="40" rx="6" fill="#2b3a31"/><rect x="36" y="10" width="18" height="12" fill="#9fd"/><rect x="40" y="44" width="10" height="20" fill="#8aa0b4"/><path d="M38 64 L36 100 M45 64 L45 104 M52 64 L54 100" stroke="#b0b8c0" stroke-width="4"/>`);

  def:[_('顶芽死亡（枯梢），下面长出多个侧芽（扫帚状）','Growing tips die back; several side shoots emerge below (witches\' broom)','Pucuk mati; beberapa tunas sisi muncul di bawah (sapu penyihir)'),_('新叶厚、脆、变形，叶柄/枝条有木栓裂纹','Young leaves thick, brittle, deformed; corky cracks on petioles / shoots','Daun muda tebal, rapuh, cacat; retakan gabus pada tangkai / pucuk'),_('花：大量落花、坐果差','Flowers: heavy drop, poor fruit set','Bunga: gugur banyak, pembuahan lemah'),_('果：裂果、果皮木栓化斑、果内空心/褐斑、畸形','Fruit: cracking, corky patches on skin, hollow / brown spots inside, deformed','Buah: retak, tompok gabus pada kulit, berongga / bintik perang di dalam, cacat'),_('成熟不均：果肉变硬、皮革状、发白、没有香味——切开前看不出来。猫山王 (D197)、金枕 (D159)、D24 果肉厚，更容易中招','Uneven ripening: aril hard, leathery, whitish, no aroma — hidden until opened. Musang King (D197), Monthong (D159) and D24 are more prone because of their thick pulp','Masak tidak sekata: isi keras, seperti kulit, keputihan, tiada aroma — tersembunyi sehingga dibuka. Musang King (D197), Monthong (D159) dan D24 lebih terdedah kerana isi tebal')],
  exc:_('硼中毒窗口很窄！老叶叶缘先黄后褐（从叶尖开始），整树都有。土施过量很难挽救。','Toxicity window is narrow! Older leaf margins yellow then brown from the tip, across the whole tree. Soil overdose is very hard to undo.','Julat ketoksikan sempit! Tepi daun tua kuning kemudian perang bermula dari hujung, seluruh pokok. Lebihan dos ke tanah sukar dipulihkan.'),
  foliar:_('速溶硼（八硼酸钠，如 Solubor）0.05–0.1%（0.5–1 g/L）配合钙，从开花到果实发育期每 2–3 周一次——马来西亚和泰国的常规做法；不要加浓','Soluble boron (disodium octaborate, e.g. Solubor) 0.05–0.1% (0.5–1 g/L) together with calcium, every 2–3 weeks from flowering through fruit development — the usual Malaysian / Thai practice; do not go stronger','Boron larut (disodium oktaborat, cth. Solubor) 0.05–0.1% (0.5–1 g/L) bersama kalsium, setiap 2–3 minggu dari berbunga hingga buah membesar — amalan biasa Malaysia / Thailand; jangan lebih pekat'),
  soil:_('硼砂土施每棵成年树只需少量（按标签，通常每棵几十克），撒在滴水线、一年一次；过量会中毒。','Soil borax: only a small amount per mature tree (per label, typically a few tens of grams), spread at the drip line, once a year; more is toxic.','Boraks ke tanah: hanya sedikit sepokok dewasa (ikut label, biasanya beberapa puluh gram), tabur di garis titisan, sekali setahun; lebih = toksik.'),
  ph:_('pH > 7 和过量石灰锁硼；沙土、干旱期容易缺。','Locks out above pH 7 and with over-liming; sandy soil and dry spells make it worse.','Terkunci di atas pH 7 dan dengan kapur berlebihan; tanah berpasir dan musim kering memburukkannya.')},
 Cu:{org:_('堆肥、海藻；铜制剂有机允许但要控制用量','Compost, seaweed; copper products are allowed in organic but must be limited','Kompos, rumpai laut; produk kuprum dibenarkan organik tetapi perlu dihadkan'),sym:'Cu',name:_('铜','Copper','Kuprum'),mob:'i',leaf:'twist',where:'young',
  role:_('木质化、酶、抗病。','Lignin, enzymes, disease resistance.','Lignin, enzim, ketahanan penyakit.'),
  def:[_('新梢尖端萎蔫、扭曲、下垂，随后枯死','Young shoot tips wilt, twist, droop, then die back','Hujung pucuk muda layu, berpintal, terkulai, kemudian mati'),_('新叶异常大而暗绿，之后变淡','Young leaves unusually large and dark green, later pale','Daun muda luar biasa besar dan hijau gelap, kemudian pucat'),_('枝条有胶状分泌、皮层开裂','Gum pockets and bark splitting on shoots','Getah dan kulit pecah pada pucuk')],
  exc:_('长期喷铜制剂（波尔多液）会积累铜，伤根、抑制铁。','Years of copper fungicide (Bordeaux) build up Cu, damaging roots and suppressing Fe.','Racun kulat kuprum (Bordeaux) bertahun-tahun menimbunkan Cu, merosakkan akar dan menghalang Fe.'),
  foliar:_('硫酸铜 0.05–0.1%（50–100 g/100 L）加展着剂，幼树用低端；或铜螯合剂。高浓度会伤喷雾泵部件','Copper sulphate 0.05–0.1% (50–100 g per 100 L) with wetting agent, low end for young trees; or a Cu chelate. Strong copper solutions damage some pump parts','Kuprum sulfat 0.05–0.1% (50–100 g/100 L) dengan agen pembasah, kadar rendah untuk pokok muda; atau kelat Cu. Larutan kuprum pekat merosakkan sesetengah bahagian pam'),
  soil:_('硫酸铜少量土施；泥炭土、沙土易缺。','Small soil doses of copper sulphate; peat and sandy soils are prone.','Dos kecil kuprum sulfat ke tanah; tanah gambut dan berpasir mudah kekurangan.'),
  ph:_('pH > 7 锁定；有机质过多（泥炭）也锁铜。','Locks out above pH 7; very high organic matter (peat) also binds Cu.','Terkunci di atas pH 7; bahan organik sangat tinggi (gambut) juga mengikat Cu.')},
 Mo:{org:_('升 pH（白云石）通常就够；堆肥','Raising pH (dolomite) is usually enough; compost','Menaikkan pH (dolomit) biasanya mencukupi; kompos'),sym:'Mo',name:_('钼','Molybdenum','Molibdenum'),mob:'m',leaf:'spots',where:'old',
  role:_('氮的利用（硝酸还原）。','Nitrogen use (nitrate reduction).','Penggunaan nitrogen (penurunan nitrat).'),
  def:[_('老叶淡黄、叶脉间斑驳、叶缘向上卷','Older leaves pale with interveinal mottling, margins cup upward','Daun tua pucat dengan belang antara urat, tepi melengkung ke atas'),_('像缺氮，但施氮无效——榴莲很少见','Looks like N deficiency but N does not fix it — rare in durian','Seperti kekurangan N tetapi N tidak membantu — jarang pada durian')],
  exc:_('极少。','Very rare.','Sangat jarang.'),
  foliar:_('钼酸钠 0.05–0.1%','Sodium molybdate 0.05–0.1%','Natrium molibdat 0.05–0.1%'),
  soil:_('升高 pH（GML）通常就够了。','Raising pH (GML) is usually enough.','Menaikkan pH (GML) biasanya mencukupi.'),
  ph:_('唯一在酸性土更缺的微量元素：pH < 5.5 严重锁定。','The one micronutrient that is scarcer on acid soil: badly locked below pH 5.5.','Satu-satunya mikronutrien yang lebih kurang di tanah berasid: terkunci teruk di bawah pH 5.5.')},
 Cl:{org:_('——','—','—'),sym:'Cl',name:_('氯','Chlorine','Klorin'),mob:'m',leaf:'margin',where:'old',
  role:_('气孔调节、光合作用。','Stomatal control, photosynthesis.','Kawalan stoma, fotosintesis.'),
  def:[_('缺乏极罕见（雨水和氯化钾已足够）。','Deficiency is extremely rare (rain and MOP supply plenty).','Kekurangan amat jarang (hujan dan MOP sudah mencukupi).')],
  exc:_('盐害/氯害：整树老叶叶缘焦枯、提早落叶——与缺钾相似但整树同时出现。检查 EC 和灌溉水。','Salt / chloride injury: marginal scorch on older leaves across the whole tree, early leaf drop — like K deficiency but tree-wide at once. Check EC and irrigation water.','Kecederaan garam / klorida: tepi daun tua hangus di seluruh pokok, gugur awal — seperti kekurangan K tetapi serentak seluruh pokok. Semak EC dan air pengairan.'),
  foliar:_('—','—','—'),
  soil:_('过量时：改用硫酸钾 (SOP)，大水淋洗，检查灌溉水盐分。','If in excess: switch to SOP, leach with clean water, check irrigation water salinity.','Jika berlebihan: tukar kepada SOP, larut resap dengan air bersih, semak kemasinan air pengairan.'),
  ph:_('与 pH 关系不大；与 EC 关系大。','Little to do with pH; a lot to do with EC.','Sedikit kaitan dengan pH; banyak kaitan dengan EC.')}
};
const NORDER=['N','P','K','Ca','Mg','S','Fe','Mn','Zn','B','Cu','Mo','Cl'];

const TREE={
 start:{q:UI.where,opts:[
  {leaf:'interV',lbl:UI.old,next:'old'},
  {leaf:'interFine',lbl:UI.young,next:'young'},

  {leaf:'fruit',lbl:_('花或果','Flowers or fruit','Bunga atau buah'),next:'fruit'},

 old:{q:UI.pattern,opts:[
  {leaf:'uniform',lbl:_('整片均匀变黄，叶脉也黄','Uniformly yellow, veins too','Kuning seluruhnya, urat pun kuning'),res:{main:['N'],alt:['Mo'],tell:_('缺氮：施氮肥 1–2 周内新叶转绿。若整树突然变黄并萎蔫，先看根（积水/根腐）。','N: new growth greens within 1–2 weeks of N fertiliser. If the whole tree yellows suddenly and wilts, check the roots first (waterlogging / root rot).','N: pucuk baru hijau dalam 1–2 minggu selepas baja N. Jika seluruh pokok kuning tiba-tiba dan layu, semak akar dahulu (takungan / reput akar).'),rule:_('积水、根腐、根结线虫、长期干旱','Waterlogging, root rot, nematodes, prolonged drought','Takungan air, reput akar, nematod, kemarau berpanjangan')}},
  {leaf:'interV',lbl:_('叶脉间黄，叶脉绿，倒 V 形','Yellow between veins, veins green, inverted V','Kuning antara urat, urat hijau, bentuk V terbalik'),res:{main:['Mg'],alt:['K','Mn'],tell:_('缺镁：黄区保持黄色，中脉两侧有绿带。缺钾：叶缘会变褐焦枯。锰中毒：有褐色小斑（酸性土）。','Mg: yellow areas stay yellow, green band along midrib. K: margins turn brown and scorch. Mn toxicity: small brown spots (acid soil).','Mg: kawasan kuning kekal kuning, jalur hijau di tengah. K: tepi menjadi perang dan hangus. Ketoksikan Mn: bintik perang kecil (tanah berasid).'),rule:_('钾施太多（相克）、沙土淋溶','Excess K (antagonism), leaching on sandy soil','Lebihan K (antagonisme), larut resap di tanah berpasir')}},
  {leaf:'margin',lbl:_('叶缘先黄后焦枯变褐','Margins yellow then scorch brown','Tepi kuning kemudian hangus perang'),res:{main:['K'],alt:['Mg','Cl'],tell:_('缺钾：从最老叶开始，逐渐向上。盐害/硼中毒：整树所有老叶同时焦边——去量 EC。缺镁：边缘黄但不焦褐。','K: starts on the oldest leaves and moves up gradually. Salt / B toxicity: all older leaves scorch at once across the tree — measure EC. Mg: margins yellow but not brown.','K: bermula pada daun tertua dan naik beransur-ansur. Garam / toksik B: semua daun tua hangus serentak — ukur EC. Mg: tepi kuning tetapi tidak perang.'),rule:_('盐害 (EC 高)、硼过量、干旱、除草剂灼伤','Salt injury (high EC), B overdose, drought, herbicide burn','Kecederaan garam (EC tinggi), lebihan B, kemarau, hangus racun rumpai')}},
  {leaf:'purple',lbl:_('暗绿无光泽，带紫/古铜色，树矮','Dull dark green, purple / bronze tint, stunted','Hijau gelap kusam, ungu / gangsa, terbantut'),res:{main:['P'],alt:[],tell:_('缺磷：整树生长慢、根少、开花迟。土壤 pH < 5.5 时磷被铝铁锁住——先升 pH 再施磷。','P: whole tree slow, few roots, late flowering. Below pH 5.5 P is locked by Al/Fe — raise pH before adding P.','P: seluruh pokok perlahan, akar sedikit, bunga lambat. Di bawah pH 5.5 P dikunci oleh Al/Fe — naikkan pH sebelum tambah P.'),rule:_('土壤板结、根受伤、低温（高地）','Compacted soil, root damage, cold (highlands)','Tanah padat, akar rosak, sejuk (tanah tinggi)')}},
  {leaf:'spots',lbl:_('褐色小斑点，叶缘皱缩','Small brown spots, crinkled margins','Bintik perang kecil, tepi berkedut'),res:{main:['Mn'],alt:['Mo','K'],tell:_('这更像锰中毒（酸性土 pH < 5）而不是缺素——量 pH。若 pH 正常，考虑真菌叶斑病或缺钼。','This is more likely Mn toxicity (acid soil, pH < 5) than a deficiency — measure pH. If pH is normal, consider fungal leaf spot or Mo deficiency.','Ini lebih mungkin ketoksikan Mn (tanah berasid, pH < 5) bukan kekurangan — ukur pH. Jika pH normal, pertimbangkan bintik daun kulat atau kekurangan Mo.'),rule:_('真菌叶斑病、藻斑病','Fungal leaf spot, algal spot','Bintik daun kulat, bintik alga'),toxMn:true}}
 ]},
 young:{q:UI.pattern,opts:[
  {leaf:'interFine',lbl:_('叶脉间黄，叶脉细绿网，叶片大小正常','Yellow between veins, fine green veins, normal size','Kuning antara urat, urat hijau halus, saiz normal'),res:{main:['Fe'],alt:['Mn'],tell:_('缺铁：叶脉网非常细、最新叶最黄，严重时发白。缺锰：叶脉两侧绿带较宽、有褐斑。两者都因 pH 高或积水——先量 pH、看排水。','Fe: very fine vein network, newest leaves yellowest, white when severe. Mn: broader green bands along veins, brown spots. Both come from high pH or waterlogging — measure pH, check drainage.','Fe: jaringan urat sangat halus, daun terbaru paling kuning, putih jika teruk. Mn: jalur hijau lebih lebar di urat, bintik perang. Kedua-duanya dari pH tinggi atau takungan — ukur pH, semak saliran.'),rule:_('积水、石灰过量、磷过量、根受伤','Waterlogging, over-liming, excess P, root damage','Takungan air, kapur berlebihan, lebihan P, akar rosak')}},
  {leaf:'interCoarse',lbl:_('叶脉间黄，绿带较宽，有褐斑','Yellow between veins, broad green bands, spots','Kuning antara urat, jalur hijau lebar, berbintik'),res:{main:['Mn'],alt:['Fe','Zn'],tell:_('缺锰：绿带宽、黄区有小褐斑、中部叶也会有。缺铁：只在最新叶、叶脉极细。缺锌：叶片明显变小。','Mn: broad green bands, small brown spots in yellow areas, middle leaves affected too. Fe: newest leaves only, very fine veins. Zn: leaves clearly smaller.','Mn: jalur hijau lebar, bintik perang kecil, daun tengah juga terkesan. Fe: daun terbaru sahaja, urat sangat halus. Zn: daun jelas lebih kecil.'),rule:_('pH > 6.5、排水差','pH above 6.5, poor drainage','pH melebihi 6.5, saliran lemah')}},
  {leaf:'small',lbl:_('新叶明显变小变窄，节间短，簇生','New leaves small and narrow, short internodes, bunched','Daun baru kecil dan sempit, ruas pendek, berkelompok'),res:{main:['Zn'],alt:['B','Cu'],tell:_('缺锌：叶小、窄、莲座状，叶脉间黄。缺硼：叶厚脆、顶芽死。草甘膦飘移也会这样——问问最近有没有喷除草剂。','Zn: small, narrow, rosetted, interveinal yellow. B: leaves thick and brittle, tips die. Glyphosate drift looks the same — ask about recent herbicide spraying.','Zn: kecil, sempit, roset, kuning antara urat. B: daun tebal rapuh, pucuk mati. Hanyutan glifosat kelihatan sama — tanya tentang semburan racun rumpai terkini.'),rule:_('草甘膦飘移、磷过量、pH > 7','Glyphosate drift, excess P, pH above 7','Hanyutan glifosat, lebihan P, pH melebihi 7')}},
  {leaf:'tip',lbl:_('叶尖焦枯、叶片弯钩畸形、生长点死','Tips burn, leaves hooked / distorted, tip dies','Hujung hangus, daun cangkuk / cacat, pucuk mati'),res:{main:['Ca'],alt:['B'],tell:_('缺钙：叶薄、尖端焦、根尖黑，常在水分忽多忽少或钾过量时出现。缺硼：叶厚脆、枝条木栓裂纹、扫帚状侧芽。','Ca: thin leaves, tip burn, black root tips, often after erratic watering or excess K. B: thick brittle leaves, corky cracks on shoots, witches\' broom.','Ca: daun nipis, hujung hangus, hujung akar hitam, selalunya selepas air tidak sekata atau lebihan K. B: daun tebal rapuh, retakan gabus, sapu penyihir.'),rule:_('水分不稳、钾过量、根受伤','Erratic water, excess K, root damage','Air tidak sekata, lebihan K, akar rosak')}},
  {leaf:'uniform',lbl:_('整片新叶均匀淡黄，叶脉也黄','Whole young leaf uniformly pale, veins too','Seluruh daun muda pucat, urat pun pucat'),res:{main:['S'],alt:['N','Fe'],tell:_('缺硫：新叶先黄（氮是老叶先黄）。严重缺铁也会整片发白，但先从叶脉间开始。','S: young leaves first (N starts on old leaves). Severe Fe also whitens the whole leaf but starts between the veins.','S: daun muda dahulu (N bermula pada daun tua). Fe teruk juga memutihkan seluruh daun tetapi bermula di antara urat.'),rule:_('缺氮（看老叶）、根受伤','N deficiency (check old leaves), root damage','Kekurangan N (semak daun tua), akar rosak')}},
  {leaf:'dieback',lbl:_('顶芽枯死，叶厚脆，枝条木栓裂纹','Tips die back, thick brittle leaves, corky cracks','Pucuk mati, daun tebal rapuh, retakan gabus'),res:{main:['B'],alt:['Cu','Ca'],tell:_('缺硼：枯梢后长出多个侧芽（扫帚状），枝条有木栓裂纹，常伴落花落果。缺铜：梢尖先萎蔫扭曲、有胶。蛀干虫也会枯梢——看枝条有没有虫孔和木屑。','B: after dieback several side shoots emerge (witches\' broom), corky cracks on shoots, often with flower/fruit drop. Cu: tips wilt and twist first, with gum. Borers also cause dieback — look for holes and frass on the shoot.','B: selepas pucuk mati, beberapa tunas sisi muncul (sapu penyihir), retakan gabus, selalu dengan bunga/buah gugur. Cu: hujung layu dan berpintal dahulu, bergetah. Pengorek juga menyebabkan pucuk mati — cari lubang dan habuk kayu.'),rule:_('蛀干虫/枝梢蛀虫、干旱、pH > 7','Borers, drought, pH above 7','Pengorek, kemarau, pH melebihi 7')}},
  {leaf:'twist',lbl:_('梢尖萎蔫扭曲下垂，有胶','Tips wilt, twist and droop, gum pockets','Hujung layu, berpintal, terkulai, bergetah'),res:{main:['Cu'],alt:['B'],tell:_('缺铜：新叶先异常大而暗绿，然后梢尖像缺水一样下垂、扭曲。缺硼：叶厚脆、顶芽直接枯死。','Cu: young leaves first unusually large and dark, then tips droop and twist as if thirsty. B: leaves thick and brittle, tip dies outright.','Cu: daun muda mula-mula luar biasa besar dan gelap, kemudian hujung terkulai dan berpintal seperti kehausan. B: daun tebal rapuh, pucuk terus mati.'),rule:_('缺水、泥炭土','Water stress, peat soil','Tekanan air, tanah gambut')}}
 ]},
 whole:{q:_('整棵树是什么情况？','What does the whole tree show?','Apa yang ditunjukkan seluruh pokok?'),opts:[
  {leaf:'tree',lbl:_('整树偏淡偏黄，长得慢','Whole tree pale and slow','Seluruh pokok pucat dan perlahan'),res:{main:['N'],alt:['S'],tell:_('若施氮后 2 周没改善，问题在根：挖开看根是白色还是褐色，闻有没有臭味。','If no improvement 2 weeks after N, the problem is in the roots: dig and check whether roots are white or brown, and whether they smell.','Jika tiada perubahan 2 minggu selepas N, masalah pada akar: gali dan lihat akar putih atau perang, dan sama ada berbau.'),rule:_('积水、根腐、线虫、土壤板结','Waterlogging, root rot, nematodes, compaction','Takungan, reput akar, nematod, tanah padat')}},
  {leaf:'treeWilt',lbl:_('土是湿的，但树却萎蔫','Soil is moist but tree wilts','Tanah lembap tetapi pokok layu'),res:{main:[],alt:[],notNutrient:{leaf:'root',title:_('根的问题——不是缺素','Root problem — not a nutrient','Masalah akar — bukan nutrien'),text:_('湿土萎蔫 = 根不能吸水：积水缺氧、疫霉根腐 (Phytophthora)、根结线虫或机械伤根。先挖根看颜色和气味，检查树干基部有没有流胶。改善排水比施肥重要。配合「榴莲树干病辨症」软件辨别。','Wilting in moist soil = roots cannot take up water: waterlogging (no oxygen), Phytophthora root rot, nematodes or mechanical root damage. Dig to check root colour and smell, look for gummosis at the trunk base. Drainage matters more than fertiliser here. Use the Durian Trunk Disease Triage app to sort it.','Layu dalam tanah lembap = akar tidak dapat menyerap air: takungan (tiada oksigen), reput akar Phytophthora, nematod atau akar cedera. Gali untuk periksa warna dan bau akar, cari getah di pangkal batang. Saliran lebih penting daripada baja di sini. Gunakan perisian Triaj Penyakit Batang Durian.')}}},

function interp(pts,x){
 if(x<=pts[0][0])return pts[0][1];
 for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(x-a)/(c-a);}}
 return pts[pts.length-1][1];
}

  {max:2,cls:'amber',t:_('轻度盐分——对这一耐盐组的作物已可能轻微减产。注意灌溉水和肥料用量。','Slight salinity — crops in this tolerance group may already lose some yield. Watch irrigation water and fertiliser doses.','Kemasinan ringan — tanaman dalam kumpulan toleransi ini mungkin sudah kehilangan sedikit hasil. Perhatikan air pengairan dan dos baja.')},
  {max:4,cls:'red',t:_('中度盐渍——{crop}明显受害，叶缘焦枯、落叶。淋洗、改善排水、换水源。','Moderately saline — {crop} clearly affected: marginal scorch, leaf drop. Leach, improve drainage, change water source.','Masin sederhana — {crop} jelas terjejas: tepi hangus, gugur daun. Larut resap, perbaiki saliran, tukar sumber air.')},
  {max:Infinity,cls:'red',t:_('强盐渍——不适合{crop}。','Strongly saline — unsuitable for {crop}.','Sangat masin — tidak sesuai untuk {crop}.')}],
 m15:[{max:.15,cls:'amber',t:_('很低——土壤几乎没有可溶养分，缺肥的可能性大。按正常量施肥，老叶黄化多半是真缺。','Very low — almost no soluble nutrients; under-fertilising is likely. Feed at normal rates; yellowing of old leaves is probably a real deficiency.','Sangat rendah — hampir tiada nutrien larut; kemungkinan kurang baja. Beri baja kadar biasa; daun tua menguning mungkin kekurangan sebenar.')},
  {max:.4,cls:'green',t:_('正常田间范围。养分供应合理，无盐害。','Normal field range. Reasonable nutrient supply, no salt stress.','Julat ladang normal. Bekalan nutrien munasabah, tiada tekanan garam.')},
  {max:.8,cls:'amber',t:_('偏高——施肥偏多或排水差。减少单次施肥量、远离树干撒施、确保下雨能淋洗。','Elevated — fertiliser on the high side or poor drainage. Reduce single doses, spread away from the trunk, make sure rain can leach.','Agak tinggi — baja agak banyak atau saliran lemah. Kurangkan dos tunggal, tabur jauh dari batang, pastikan hujan boleh larut resap.')},
  {max:1.6,cls:'red',t:_('高——盐分已伤根，叶缘焦枯、落叶可能就是这个原因，不是缺钾。停肥，大水淋洗，检查灌溉水 EC，覆盖保湿。','High — salts are already hurting roots; marginal scorch and leaf drop are probably this, not K deficiency. Stop fertiliser, leach with plenty of clean water, check irrigation water EC, mulch.','Tinggi — garam sudah merosakkan akar; tepi hangus dan gugur mungkin kerana ini, bukan kekurangan K. Hentikan baja, larut resap dengan banyak air bersih, semak EC air pengairan, sungkup.')},
  {max:Infinity,cls:'red',t:_('盐渍。{crop}无法正常生长。停止一切化肥，反复淋洗，改善排水，查灌溉水来源（咸水/井水）。','Saline. {crop} cannot grow normally. Stop all chemical fertiliser, leach repeatedly, improve drainage, check the irrigation water source (brackish / well water).','Masin. {crop} tidak dapat tumbuh normal. Hentikan semua baja kimia, larut resap berulang kali, perbaiki saliran, semak sumber air pengairan (air payau / telaga).')}],
 mpour:[{max:.75,cls:'amber',t:_('低——介质养分不足，正常施肥。','Low — substrate short of nutrients; feed normally.','Rendah — medium kurang nutrien; beri baja seperti biasa.')},

  {max:Infinity,cls:'red',t:_('过高——已伤根。用清水淋洗至少 3 次介质体积。','Excessive — roots damaged. Flush with at least 3× the pot volume of clean water.','Berlebihan — akar rosak. Siram dengan air bersih sekurang-kurangnya 3× isipadu pasu.')}],

  {max:1.5,cls:'amber',t:_('中等盐分——长期使用会累积，雨季靠雨水淋洗；避免高频率小量灌溉。','Moderate salts — build up over time; rely on rain to leach in the wet season; avoid frequent small irrigations.','Garam sederhana — terkumpul lama-kelamaan; harapkan hujan untuk larut resap; elakkan pengairan kecil yang kerap.')},

const METERS=[
 {ic:'meter3',ok:'warn',title:_('三合一 / 四合一指针式插土仪（便宜的那种）','Cheap analog 3-in-1 / 4-in-1 probe','Prob analog 3-dalam-1 / 4-dalam-1 murah'),t:_('湿度：可作粗略参考。pH：精度有限，读数常与浸提法相差较大，建议只作参考，施石灰前用浸提法复核。光照：对果园用处不大。','Moisture: rough guide. pH: limited accuracy — readings often differ noticeably from the slurry method, so treat them as a guide and confirm with the slurry method before liming. Light: of little use in an orchard.','Kelembapan: panduan kasar. pH: ketepatan terhad — bacaan sering berbeza ketara daripada kaedah larutan, jadi anggap sebagai panduan dan sahkan dengan kaedah larutan sebelum mengapur. Cahaya: kurang berguna di dusun.')},
 {ic:'probe',ok:true,title:_('数字直插式 pH 仪','Digital direct-insert pH meter','Meter pH digital cucuk terus'),t:_('湿土中可用，约 ±0.3。每次用前用标准液校正、探头擦干净；多点取中间值。玻璃探头易碎，插入前先用小棍在土里开孔，不要硬插石块多的土。','Usable in moist soil, about ±0.3. Calibrate with buffer before each session, wipe the probe clean, take the middle of several readings. Glass probes break easily — make a pilot hole with a stick first and never force it into stony soil.','Boleh digunakan dalam tanah lembap, kira-kira ±0.3. Tentukur dengan penimbal sebelum setiap sesi, lap prob, ambil nilai tengah beberapa bacaan. Prob kaca mudah pecah — buat lubang dengan kayu dahulu dan jangan paksa ke dalam tanah berbatu.')},
 {ic:'probe',ok:true,title:_('直插式 EC / TDS 探头','Direct-insert EC / TDS probe','Prob EC / TDS cucuk terus'),t:_('测的是湿土的整体 EC，读数随含水量变化——同一块地干时读 0.3、湿时读 0.9 都正常。固定在雨后 24 小时测才能前后比较。本软件「直插式」分级就是按湿土读数。','Measures bulk EC of moist soil, and the number moves with water content — the same soil can read 0.3 dry and 0.9 wet. Always measure 24 h after rain so readings are comparable. This app\'s "direct-insert" bands assume moist soil.','Mengukur EC pukal tanah lembap, dan nilainya berubah dengan kandungan air — tanah yang sama boleh membaca 0.3 kering dan 0.9 lembap. Ukur sentiasa 24 jam selepas hujan supaya boleh dibandingkan. Jalur "cucuk terus" dalam perisian ini mengandaikan tanah lembap.')},
 {ic:'probe',ok:'warn',title:_('七合一 / 五合一多参数土壤仪','7-in-1 / 5-in-1 multi-parameter soil meter','Meter tanah pelbagai parameter 7-dalam-1 / 5-dalam-1'),t:_('湿度、温度、EC：可用（同上注意事项）；pH 视型号而定。氮、磷、钾读数在多数平价型号上是根据 EC 推算的估计值，而不是对各养分的直接测定，所以三个数往往一起升降，用来看施肥前后的趋势有帮助，但不足以分辨具体缺哪一种养分。施肥决定请结合辨症页的叶片症状、测试盒或叶片分析，并参考仪表说明书了解其测量原理。','Moisture, temperature, EC: usable (same cautions as above); pH depends on the model. On most affordable models the N, P and K readings are estimates derived from EC rather than direct measurements of each nutrient, so the three tend to rise and fall together — helpful for watching the trend before and after fertilising, but not enough on their own to tell which nutrient is short. For fertiliser decisions, combine them with the leaf symptoms in the Diagnose tab, a test kit or a leaf analysis, and check the meter\'s manual for how it measures.','Kelembapan, suhu, EC: boleh digunakan (langkah berjaga sama); pH bergantung pada model. Pada kebanyakan model mampu milik, bacaan N, P dan K ialah anggaran yang diterbitkan daripada EC dan bukan ukuran langsung setiap nutrien, jadi ketiga-tiganya cenderung naik turun bersama — berguna untuk melihat trend sebelum dan selepas baja, tetapi tidak mencukupi untuk menentukan nutrien mana yang kurang. Untuk keputusan baja, gabungkan dengan simptom daun di halaman Diagnosis, kit ujian atau analisis daun, dan rujuk manual meter untuk cara ia mengukur.')},
 {ic:'pen',ok:true,title:_('pH 笔 + EC 笔（浸提法）','pH pen + EC pen (slurry method)','Pen pH + pen EC (kaedah larutan)'),t:_('最可靠的便宜方案：土加水浸提后再测，不受土壤湿度影响。每支几十令吉，校正液别省。','The most reliable cheap option: measure a soil-water slurry, unaffected by soil moisture. A few tens of ringgit each; do not skip the calibration buffer.','Pilihan murah paling boleh dipercayai: ukur larutan tanah-air, tidak dipengaruhi kelembapan tanah. Beberapa puluh ringgit setiap satu; jangan abaikan penimbal penentukuran.')},
 {ic:'ise',ok:true,title:_('单离子电极笔（硝酸根、钾、钙、钠）','Ion-selective pens (nitrate, potassium, calcium, sodium)','Pen elektrod pemilih ion (nitrat, kalium, kalsium, natrium)'),t:_('真正测一种养分的仪器（如 LAQUAtwin 系列）。笔头的膜只对一种离子起反应，电压随浓度变化。滴几滴 1:5 土壤浸提液，或叶柄/叶片挤出的汁液，直接读 ppm。叶汁硝酸根最有用——它告诉你树今天体内有多少氮，而不是土里可能释放多少。每次用前要用两种标准液校正，传感器不能干放。一支约 RM1,500–2,500，多数人只买硝酸根和钾两支。','A meter that really measures one nutrient (the LAQUAtwin family, for example). The membrane on the tip responds to one ion only, and its voltage changes with concentration. Put a few drops of 1:5 soil extract, or sap squeezed from a petiole or leaf, on the sensor and read ppm. Sap nitrate is the most useful: it tells you how much N the tree has in its pipes today, not what the soil might release. Calibrate with two standard solutions before each session and never let the sensor dry out. About RM1,500–2,500 per pen; most growers buy nitrate and potassium only.','Meter yang benar-benar mengukur satu nutrien (keluarga LAQUAtwin, contohnya). Membran di hujung bertindak balas kepada satu ion sahaja, dan voltannya berubah dengan kepekatan. Letak beberapa titis ekstrak tanah 1:5, atau sap yang diperah dari tangkai atau daun, pada sensor dan baca ppm. Nitrat sap paling berguna: ia memberitahu berapa banyak N dalam pokok hari ini, bukan apa yang mungkin dibebaskan tanah. Tentukur dengan dua larutan piawai sebelum setiap sesi dan jangan biarkan sensor kering. Kira-kira RM1,500–2,500 sepen; kebanyakan pekebun beli nitrat dan kalium sahaja.')},
 {ic:'spad',ok:true,title:_('叶绿素仪（SPAD / atLEAF）','Chlorophyll meter (SPAD / atLEAF)','Meter klorofil (SPAD / atLEAF)'),t:_('夹住叶片，比较红光（约 650 nm）和近红外光（约 940 nm）穿过叶片的比例——叶绿素吸收红光，所以得到一个「绿度」数字。氮是叶绿素的主要推手，先在一棵施肥充足的同品种、同叶龄的参照树上读一个基准值，之后就能跟踪氮的变化。它分不清氮、硫、镁、铁的缺乏——这几种都会让叶片变淡。','Clamps onto a leaf and compares how much red (≈650 nm) and near-infrared (≈940 nm) light pass through — chlorophyll absorbs red, so it gives a "greenness" number. N is the main driver of chlorophyll, so read a baseline on a well-fed reference tree of the same cultivar and leaf age first, then track N changes against it. It cannot separate N from S, Mg or Fe shortage — all of them pale the leaf.','Mengapit daun dan membandingkan berapa banyak cahaya merah (≈650 nm) dan inframerah dekat (≈940 nm) yang menembusi — klorofil menyerap merah, jadi ia memberi angka "kehijauan". N ialah pemacu utama klorofil, jadi baca garis dasar pada pokok rujukan yang cukup baja, klon dan umur daun sama dahulu, kemudian jejak perubahan N berbanding dengannya. Ia tidak dapat membezakan kekurangan N daripada S, Mg atau Fe — semuanya memucatkan daun.')},
 {ic:'strip',ok:true,title:_('硝酸根试纸 / 反射仪','Nitrate test strips / reflectometer','Jalur ujian nitrat / reflektometer'),t:_('把试纸浸入叶汁或浸提液，颜色深浅对照色卡——真正的化学反应，便宜快速，但只分几个等级。配反射仪读颜色可以得到数值。','Dip the strip in sap or extract and match the colour against the chart — real chemistry, cheap and quick, but only a few bands. A reflectometer that reads the strip colour turns it into a number.','Celup jalur dalam sap atau ekstrak dan padankan warna dengan carta — kimia sebenar, murah dan cepat, tetapi hanya beberapa jalur. Reflektometer yang membaca warna jalur menukarkannya kepada nombor.')},
 {ic:'photometer',ok:true,title:_('便携光度计（Hanna、Palintest 类）','Portable photometer (Hanna, Palintest type)','Fotometer mudah alih (jenis Hanna, Palintest)'),t:_('用试剂与浸提液反应显色，仪器测颜色深度，一次测一种元素（磷、钾、镁、铁等）。接近实验室精度，约 RM3,000 起，每个元素要买对应试剂——适合合作社或大园共用。','Reagents react with the extract to form a colour, and the instrument measures its depth, one element at a time (P, K, Mg, Fe and so on). Close to lab accuracy, from about RM3,000, with a reagent pack to buy per element — suited to a cooperative or a large farm sharing one unit.','Reagen bertindak balas dengan ekstrak membentuk warna, dan alat mengukur kedalamannya, satu unsur pada satu masa (P, K, Mg, Fe dan sebagainya). Hampir ketepatan makmal, dari kira-kira RM3,000, dengan pek reagen dibeli bagi setiap unsur — sesuai untuk koperasi atau ladang besar berkongsi satu unit.')},
 {ic:'kit',ok:true,title:_('比色土壤测试盒（N、P、K、pH）','Colour soil test kit (N, P, K, pH)','Kit ujian tanah warna (N, P, K, pH)'),t:_('真正的化学反应，能粗略分「低 / 中 / 高」。比七合一的 NPK 数字诚实得多，但只是等级，不是数值。','Real chemistry; gives a rough low / medium / high. Far more honest than a 7-in-1 NPK number, but it is a grade, not a value.','Kimia sebenar; memberi anggaran rendah / sederhana / tinggi. Jauh lebih jujur daripada angka NPK 7-dalam-1, tetapi ia gred, bukan nilai.')}
];
const TESTS=[
 {leaf:'cup',title:_('pH 测试（土:水 1:2.5）','pH test (soil:water 1:2.5)','Ujian pH (tanah:air 1:2.5)'),steps:[_('在树冠滴水线下取 15 cm 深的土，一棵树取 3–4 点混合','Take soil 15 cm deep under the drip line, 3–4 spots per tree, mixed','Ambil tanah 15 cm dalam di bawah garis titisan, 3–4 titik sepokok, dicampur'),_('1 份土加 2.5 份雨水/蒸馏水，搅拌，静置 30 分钟','1 part soil + 2.5 parts rain / distilled water, stir, stand 30 min','1 bahagian tanah + 2.5 bahagian air hujan / suling, kacau, biar 30 minit'),_('用校正过的 pH 笔测上层清液；每次用前用 pH 7 和 pH 4 校正液校正','Measure the clear top liquid with a calibrated pH pen; calibrate with pH 7 and pH 4 buffer before each session','Ukur cecair jernih atas dengan pen pH yang ditentukur; tentukur dengan penimbal pH 7 dan 4 sebelum setiap sesi'),_('便宜的指针式插土 pH 计精度有限——施石灰前用这个浸提法复核','Cheap analog probe-in-soil pH meters have limited accuracy — confirm with this slurry method before liming','Meter pH cucuk-tanah analog murah ketepatannya terhad — sahkan dengan kaedah larutan ini sebelum mengapur')]},
 {leaf:'cup',title:_('EC 测试（土:水 1:5）','EC test (soil:water 1:5)','Ujian EC (tanah:air 1:5)'),steps:[_('同样取土；1 份土加 5 份雨水/蒸馏水（按体积）','Same sampling; 1 part soil + 5 parts rain / distilled water (by volume)','Pensampelan sama; 1 bahagian tanah + 5 bahagian air hujan / suling (mengikut isipadu)'),_('摇 1 分钟，静置 5 分钟，用 EC 笔测','Shake 1 min, stand 5 min, measure with an EC pen','Goncang 1 minit, biar 5 minit, ukur dengan pen EC'),_('读数单位：dS/m = mS/cm；1 dS/m = 1000 µS/cm','Units: dS/m = mS/cm; 1 dS/m = 1000 µS/cm','Unit: dS/m = mS/cm; 1 dS/m = 1000 µS/cm'),_('沙土同样盐分读数偏低，黏土偏高——判断时留余地','Sandy soil reads lower and clay higher for the same salinity — allow some margin','Tanah berpasir membaca lebih rendah dan tanah liat lebih tinggi untuk kemasinan sama — beri sedikit ruang')]},
 {leaf:'hole',title:_('排水测试','Drainage test','Ujian saliran'),steps:[_('土不要太湿时测（湿土会把洞壁抹光，读数不准）。挖 30 cm 深、15–20 cm 宽的洞，灌满水，等它完全渗完——这是让土饱和','Test when the soil is not waterlogged (wet soil glazes the hole walls and gives a false reading). Dig a hole 30 cm deep and 15–20 cm wide, fill with water and let it drain completely — this saturates the soil','Uji apabila tanah tidak bertakung (tanah basah melicinkan dinding lubang dan memberi bacaan palsu). Gali lubang 30 cm dalam, 15–20 cm lebar, isi air dan biar meresap sepenuhnya — ini menepukan tanah'),_('马上再灌满，用尺量：15 分钟后水位降了多少厘米，乘 4 = 每小时下降厘米数','Refill at once and measure with a ruler: how many cm the water drops in 15 minutes, × 4 = cm per hour','Isi semula segera dan ukur dengan pembaris: berapa cm air turun dalam 15 minit, × 4 = cm sejam'),_('每小时 2.5–7.5 cm：良好（果树理想 2.5–5 cm）；< 2.5 cm：排水差——先开沟或起垄再种；> 10 cm：太快（沙土，养分和水容易流失，少量多次施肥）','2.5–7.5 cm per hour: good (fruit trees ideal 2.5–5); under 2.5 cm: poor — trench or raise beds before planting; over 10 cm: too fast (sandy, water and nutrients leach; feed little and often)','2.5–7.5 cm sejam: baik (pokok buah ideal 2.5–5); bawah 2.5 cm: lemah — buat parit atau batas tinggi sebelum menanam; lebih 10 cm: terlalu cepat (berpasir, air dan nutrien hilang; baja sedikit tetapi kerap)'),_('另外看 24 小时：洞里的水必须完全退掉。一天后还积水的地点，根会出问题','Also check at 24 hours: the hole must be completely empty. A spot still holding water after a day will damage roots','Semak juga pada 24 jam: lubang mesti kosong sepenuhnya. Tempat yang masih bertakung selepas sehari akan merosakkan akar'),_('排水差的树出现的「缺素」先解决排水','On poorly drained trees, fix drainage before treating any "deficiency"','Pada pokok saliran lemah, perbaiki saliran sebelum rawat "kekurangan"')]},
 {leaf:'jar',title:_('瓶子质地测试','Jar texture test','Ujian tekstur balang'),steps:[_('透明瓶装 1/3 土，加水到 2/3，加一点洗洁精，摇 2 分钟','Fill a clear jar 1/3 with soil, water to 2/3, a drop of dish soap, shake 2 min','Isi balang jernih 1/3 tanah, air hingga 2/3, setitik sabun pinggan, goncang 2 minit'),_('1 分钟后沉下的是沙，2 小时后是粉砂，1–2 天后是黏土','What settles in 1 min is sand, by 2 h silt, after 1–2 days clay','Yang mendap dalam 1 minit ialah pasir, 2 jam kelodak, 1–2 hari tanah liat'),_('沙多：少量多次施肥，钾镁硼容易流失；黏多：注意排水，钾锁定，少施多次','Sandy: small frequent doses, K / Mg / B leach easily. Clayey: watch drainage, K gets fixed, apply little and often','Berpasir: dos kecil kerap, K / Mg / B mudah hilang. Berliat: jaga saliran, K terikat, beri sedikit tetapi kerap')]},
 {leaf:'worm',title:_('有机质与土壤生命','Organic matter & soil life','Bahan organik & hidupan tanah'),steps:[_('表土深褐/黑色、松软、有土腥味 = 有机质好','Dark brown / black, crumbly topsoil with an earthy smell = good organic matter','Tanah atas perang gelap / hitam, peroi, berbau tanah = bahan organik baik'),_('一铲（约 20×20×20 cm）湿土里能找到 3 条以上蚯蚓 = 土壤健康','3 or more earthworms in one spade of moist soil (≈20×20×20 cm) = healthy soil','3 atau lebih cacing tanah dalam satu penyodok tanah lembap (≈20×20×20 cm) = tanah sihat'),_('双氧水测试（FAO 田间方法）：一勺土挑掉根和落叶，滴几滴双氧水。不冒泡 = 有机质/土壤生命低；轻微冒泡 = 中等；剧烈冒泡起泡沫 = 好。注意：冒泡的是土壤微生物的酶和锰，所以它测的是「活性」；有些土天生不太冒泡，不冒泡不等于一定差；新鲜堆肥或粪肥会狂冒泡，不代表下面的土。药房 3% 的反应比实验室 30% 弱——拿自己园里最好的土做对照','Hydrogen peroxide test (FAO field method): a spoon of soil with roots and litter picked out, a few drops of peroxide. No fizz = low organic matter / soil life; light fizz = moderate; strong fizz or foam = good. Caveats: what fizzes is microbial enzyme and manganese, so it measures activity; some soils barely react, so no fizz does not prove poor soil; fresh compost or manure foams wildly and says nothing about the soil below. Pharmacy 3% reacts less than lab 30% — compare against the best soil in your own orchard','Ujian hidrogen peroksida (kaedah ladang FAO): sesudu tanah tanpa akar dan sampah, beberapa titis peroksida. Tiada buih = bahan organik / hidupan tanah rendah; buih sedikit = sederhana; buih kuat atau berbusa = baik. Peringatan: yang berbuih ialah enzim mikrob dan mangan, jadi ia mengukur aktiviti; sesetengah tanah kurang bertindak balas, jadi tiada buih tidak membuktikan tanah lemah; kompos atau baja segar berbuih kuat dan tidak menggambarkan tanah di bawah. Farmasi 3% bertindak kurang daripada makmal 30% — bandingkan dengan tanah terbaik di dusun sendiri'),_('泡水测试：一块干土块放进一杯水。几分钟还保持形状 = 结构好；几秒钟散成泥 = 结构差、有机质少','Slake test: drop a dry clod into a glass of water. Holds its shape for minutes = good structure; collapses into mud within seconds = poor structure, low organic matter','Ujian rendam: masukkan ketulan tanah kering ke dalam segelas air. Kekal bentuk beberapa minit = struktur baik; hancur jadi lumpur dalam beberapa saat = struktur lemah, kurang bahan organik'),_('一铲看结构：松散团粒、有孔隙、根直直往下 = 好；片状板结、根到某一层横着长、灰色或橙色斑块 = 板结或积水','One spade for structure: crumbly aggregates with pores and roots going straight down = good; platy compacted layers, roots turning sideways at one depth, grey or orange mottles = compaction or waterlogging','Satu penyodok untuk struktur: agregat peroi berliang dengan akar lurus ke bawah = baik; lapisan padat berkeping, akar membelok mendatar pada satu kedalaman, tompok kelabu atau jingga = padat atau bertakung'),_('有机质低的土，微量元素和硫更容易缺，pH 变化也更快','Low-organic-matter soils run short of micronutrients and S sooner, and pH swings faster','Tanah kurang bahan organik lebih cepat kekurangan mikronutrien dan S, dan pH berubah lebih cepat')]},
 {leaf:'leaves3',title:_('叶片对比法','Leaf comparison method','Kaedah perbandingan daun'),steps:[_('同一枝条上摘最老叶、中间叶、最新叶各一片并排','From one branch pick the oldest, a middle and the newest leaf, lay them side by side','Dari satu dahan petik daun tertua, tengah dan terbaru, susun bersebelahan'),_('老叶最黄 = 可移动养分 (N, P, K, Mg)；新叶最黄 = 不可移动养分 (Fe, Mn, Zn, B, Ca, S)','Oldest yellowest = mobile nutrient (N, P, K, Mg); newest yellowest = immobile (Fe, Mn, Zn, B, Ca, S)','Tertua paling kuning = nutrien mudah alih (N, P, K, Mg); terbaru paling kuning = tidak mudah alih (Fe, Mn, Zn, B, Ca, S)'),_('再看黄的是整片还是叶脉间、是叶缘还是叶尖——这就是辨症页的流程','Then check whether the yellow is whole-leaf or between veins, margin or tip — that is the Diagnose page flow','Kemudian lihat kuning seluruh daun atau antara urat, tepi atau hujung — itulah aliran halaman Diagnosis'),_('拍照记录日期，2 周后同一枝条再拍一张对比','Photograph with the date; photograph the same branch again 2 weeks later to compare','Ambil gambar dengan tarikh; ambil gambar dahan sama 2 minggu kemudian untuk banding')]}
];
const ANTAG=[
 {hi:'K',lo:['Mg','Ca'],t:_('钾施多了，先出镁缺（老叶倒 V 黄化），再出钙缺（果裂、蒂软）。钾肥要配镁一起施。','Too much K shows up first as Mg deficiency (inverted-V yellowing on old leaves), then Ca (fruit cracking, soft stem end). Always pair K with Mg.','Lebihan K muncul dahulu sebagai kekurangan Mg (kuning bentuk V pada daun tua), kemudian Ca (buah retak, pangkal lembut). Sentiasa gandingkan K dengan Mg.')},
 {hi:'Ca',lo:['Mg','K','Fe','Mn','Zn','B'],t:_('石灰过量 = pH 推高，把所有微量元素锁住，同时压镁和钾。榴莲 pH 超过 6.5 就停石灰。','Over-liming = pH pushed up, locking every micronutrient and suppressing Mg and K. Stop liming once durian soil passes pH 6.5.','Kapur berlebihan = pH naik, mengunci semua mikronutrien dan menghalang Mg dan K. Hentikan kapur apabila pH tanah durian melepasi 6.5.')},
 {hi:'P',lo:['Zn','Fe','Cu'],t:_('磷肥过多（尤其每年都施）锁锌、铁、铜——出现小叶病和新叶黄化。磷在土里不流失，不必年年施。','Excess P (especially applied every year) locks Zn, Fe and Cu — little-leaf and young-leaf yellowing appear. P does not leach, so it need not be applied yearly.','Lebihan P (terutama setiap tahun) mengunci Zn, Fe dan Cu — daun kecil dan daun muda menguning. P tidak larut resap, tidak perlu diberi setiap tahun.')},
 {hi:'N',lo:['K','B','Cu'],t:_('氮过多：枝叶疯长、果实品质差、招虫、坐果差，相对造成钾硼铜不足。','Excess N: lush growth, poor fruit quality, pests, poor fruit set, and relative K / B / Cu shortage.','Lebihan N: tumbesaran subur, kualiti buah lemah, perosak, pembuahan lemah, dan kekurangan relatif K / B / Cu.')},
 {hi:'Mg',lo:['K','Ca'],t:_('镁过量（白云石/泻盐施太多）反过来压钾和钙。','Excess Mg (too much dolomite / Epsom) in turn suppresses K and Ca.','Lebihan Mg (dolomit / Epsom terlalu banyak) pula menghalang K dan Ca.')},
 {hi:'Zn',lo:['Fe'],t:_('锌喷太频繁会诱发缺铁。','Spraying Zn too often induces Fe deficiency.','Menyembur Zn terlalu kerap mencetuskan kekurangan Fe.')},
 {hi:'Fe',lo:['Mn'],t:_('积水酸性土中铁溶出过多，压制锰。','On waterlogged acid soil excess soluble Fe suppresses Mn.','Di tanah berasid bertakung, Fe larut berlebihan menghalang Mn.')}
];
const TOX=[
 {art:'sprayBurn',title:_('叶面喷施灼伤','Foliar spray scorch','Hangus semburan daun'),t:_('喷后 1–3 天出现，只在喷湿的叶片上，新梢和向阳面最重，斑点或焦边沿喷到的地方分布。原因：浓度太高、中午喷、没加展着剂、几种药肥混一桶、喷到最后喷嘴滴浓液。处理：清水冲，停喷 2 周，下次减半浓度、傍晚喷、先试几棵。预防：用喷雾级（不是肥料级）硫酸盐、加展着剂、幼果头 4 周不喷微量元素。','Appears 1–3 days after spraying, only on wetted leaves, worst on new flush and the sunny side, spots or scorch following the spray pattern. Causes: too strong, midday spraying, no wetting agent, several products in one tank, concentrate dripping at the end of the run. Fix: rinse, no spraying for 2 weeks, next time half strength, evening, test trees first. Prevention: spray-grade (not fertiliser-grade) sulphates, a wetting agent, and no trace-element sprays in the first 4 weeks of fruit development.','Muncul 1–3 hari selepas sembur, hanya pada daun basah, paling teruk pada pucuk baru dan sisi cerah, bintik atau hangus mengikut corak semburan. Punca: terlalu pekat, sembur tengah hari, tiada agen pembasah, beberapa produk satu tangki, pekatan menitis di hujung. Pemulihan: bilas, jangan sembur 2 minggu, kali seterusnya separuh kepekatan, waktu petang, uji pokok dahulu. Pencegahan: sulfat gred semburan (bukan gred baja), agen pembasah, dan tiada semburan unsur surih dalam 4 minggu pertama buah.')},
 {art:'tip',title:_('尿素缩二脲灼伤','Urea biuret burn','Hangus biuret urea'),t:_('叶面喷劣质尿素后叶尖和叶缘黄化、焦枯，新叶最明显。原因是尿素里的缩二脲杂质。叶面用尿素要选缩二脲 < 0.25% 的，或改用硝酸钾/氨基酸肥。','Tip and margin yellowing and scorch after foliar urea, clearest on new leaves — from the biuret impurity in low-grade urea. For foliar use choose urea with biuret under 0.25%, or switch to potassium nitrate / amino-acid products.','Hujung dan tepi menguning serta hangus selepas sembur urea, paling jelas pada daun baru — daripada bendasing biuret dalam urea gred rendah. Untuk semburan pilih urea dengan biuret bawah 0.25%, atau tukar kepada kalium nitrat / produk asid amino.')},
 {art:'spotDisease',title:_('锌 / 铜 / 硫酸盐喷施灼伤','Zinc / copper / sulphate spray burn','Hangus semburan zink / kuprum / sulfat'),t:_('硫酸锌、硫酸铜、硫酸锰单独喷容易灼叶：褐色小斑、叶缘焦。解决：改用螯合剂产品，按标签浓度；先在几棵树上试。','Zinc, copper and manganese sulphates sprayed alone often burn: small brown spots, marginal scorch. Switch to a chelated product at the label rate; test on a few trees first.','Zink, kuprum dan mangan sulfat yang disembur sendirian sering menghangus: bintik perang kecil, tepi hangus. Tukar kepada produk kelat pada kadar label; uji pada beberapa pokok dahulu.')},
 {art:'alroot',title:_('液体肥 / 滴灌烧根','Liquid feed / fertigation root burn','Baja cecair / fertigasi membakar akar'),t:_('干土上直接浇浓肥液，或肥液 EC 太高，细根烧死——几天内整树萎蔫、老叶焦边、落叶。先浇清水再施肥，肥液 EC 按作物表，幼树减半。','Strong liquid fertiliser on dry soil, or feed EC too high, kills fine roots — within days the tree wilts, old leaves scorch and drop. Water with clean water before feeding, keep feed EC per the crop table, halve it for young trees.','Baja cecair pekat pada tanah kering, atau EC larutan terlalu tinggi, membunuh akar halus — dalam beberapa hari pokok layu, daun tua hangus dan gugur. Siram air bersih sebelum baja, EC larutan ikut jadual tanaman, separuhkan untuk pokok muda.')},
 {art:'drift',title:_('农药 / 除草剂药害','Pesticide / herbicide phytotoxicity','Fitotoksisiti racun perosak / rumpai'),t:_('铜制剂、矿物油、硫磺在高温天喷会灼叶；除草剂飘移让新叶变小变黄扭曲。特征：跟着喷药时间和方向走，不分老叶新叶。查喷药记录，比查养分更快。','Copper products, mineral oil and sulphur sprayed in hot weather burn leaves; herbicide drift makes new leaves small, yellow and twisted. The tell: damage follows the spray date and direction, not the old-leaf / young-leaf rule. Check the spray record before the nutrients.','Produk kuprum, minyak mineral dan sulfur yang disembur cuaca panas menghangus daun; hanyutan racun rumpai menjadikan daun baru kecil, kuning dan berpintal. Tandanya: kerosakan mengikut tarikh dan arah semburan, bukan peraturan daun tua / muda. Semak rekod semburan sebelum nutrien.')},
 {art:'margin',leaf:'margin',title:_('硼中毒','Boron toxicity','Ketoksikan boron'),t:_('老叶从叶尖和叶缘开始黄→褐，整树都有，叶片提早落。来源：硼砂土施过量、一次施完。补救：大水淋洗、施石灰、几个月都不要再碰硼。','Older leaves yellow then brown from tip and margin, across the whole tree, early leaf drop. Cause: soil borax overdose or one big dose. Remedy: leach with plenty of water, apply lime, no B for months.','Daun tua kuning kemudian perang dari hujung dan tepi, seluruh pokok, gugur awal. Punca: lebihan boraks ke tanah atau satu dos besar. Pemulihan: larut resap dengan banyak air, beri kapur, jangan beri B berbulan-bulan.')},
 {art:'spots',leaf:'spots',title:_('锰中毒','Manganese toxicity','Ketoksikan mangan'),t:_('酸性土 (pH < 5) 常见：老叶褐色小斑、叶缘皱缩、叶脉变黑、提早落叶。补救：GML/白云石升 pH，改善排水。','Common on acid soil (pH < 5): small brown spots on old leaves, crinkled margins, dark veins, early drop. Remedy: raise pH with GML / dolomite, improve drainage.','Biasa di tanah berasid (pH < 5): bintik perang kecil pada daun tua, tepi berkedut, urat menghitam, gugur awal. Pemulihan: naikkan pH dengan GML / dolomit, perbaiki saliran.')},
 {art:'alroot',leaf:'root',title:_('铝中毒','Aluminium toxicity','Ketoksikan aluminium'),t:_('pH < 5 时铝溶出，根尖变粗变短、变褐，细根少，地上部像缺磷缺钙。补救：GML/白云石，有机质。','Below pH 5 Al dissolves: root tips thick, short and brown, few fine roots; top looks like P / Ca deficiency. Remedy: GML / dolomite, organic matter.','Di bawah pH 5 Al larut: hujung akar tebal, pendek, perang, sedikit akar halus; atas kelihatan seperti kekurangan P / Ca. Pemulihan: GML / dolomit, bahan organik.')},
 {art:'saltPile',leaf:'salt',title:_('盐害 / 肥料烧根','Salt injury / fertiliser burn','Kecederaan garam / baja terbakar'),t:_('整树老叶叶缘同时焦枯、萎蔫、落叶，施肥后几天内出现。来源：肥料堆在树干旁、一次施太多、灌溉水咸。补救：大水淋洗，肥料撒在滴水线、分次。','Marginal scorch on all older leaves at once, wilting, leaf drop, within days of fertilising. Cause: fertiliser piled at the trunk, one big dose, saline water. Remedy: leach, spread fertiliser at the drip line in split doses.','Tepi semua daun tua hangus serentak, layu, gugur, dalam beberapa hari selepas baja. Punca: baja dilonggok di batang, satu dos besar, air masin. Pemulihan: larut resap, tabur baja di garis titisan secara berbahagi.')},
 {art:'shoot',leaf:'shoot',title:_('氮过量','Nitrogen excess','Lebihan nitrogen'),t:_('枝叶软嫩徒长、颜色很深、只长叶不开花、容易招蚜虫粉介壳虫和病害、果实品质差。补救：停氮，增钾钙，修剪。','Soft lush dark growth, leaves instead of flowers, aphids / mealybugs / disease, poor fruit quality. Remedy: stop N, add K and Ca, prune.','Tumbesaran lembut subur gelap, daun bukan bunga, afid / koya / penyakit, kualiti buah lemah. Pemulihan: hentikan N, tambah K dan Ca, cantas.')}
];
const LOOK=[
 {art:'trunk',leaf:'trunk',title:_('疫霉 (Phytophthora) 树干病 / 根腐','Phytophthora canker / root rot','Kanker / reput akar Phytophthora'),t:_('整树黄化、萎蔫、落叶，像缺氮缺钾，但树干基部流胶、树皮内变褐。施肥无效，要治病和排水。用「榴莲树干病辨症」软件。','Tree-wide yellowing, wilting and leaf drop that mimics N / K deficiency, but with gummosis at the trunk base and brown tissue under the bark. Fertiliser does nothing — treat the disease and the drainage. Use the Durian Trunk Disease Triage app.','Kuning seluruh pokok, layu dan gugur seperti kekurangan N / K, tetapi bergetah di pangkal batang dan tisu perang di bawah kulit. Baja tidak membantu — rawat penyakit dan saliran. Guna perisian Triaj Penyakit Batang Durian.')},
 {art:'root',leaf:'root',title:_('积水 / 缺氧','Waterlogging / no oxygen','Takungan / tiada oksigen'),t:_('雨季后新叶黄化（像缺铁）、老叶落、树势弱。根褐色有臭味。开沟排水比任何肥料都有效。','After the wet season: young-leaf yellowing (like Fe), old-leaf drop, weak tree. Roots brown and smelly. Drainage trenches beat any fertiliser.','Selepas musim hujan: daun muda menguning (seperti Fe), daun tua gugur, pokok lemah. Akar perang dan berbau. Parit saliran lebih berkesan daripada mana-mana baja.')},
 {art:'drift',leaf:'small',title:_('草甘膦飘移','Glyphosate drift','Hanyutan glifosat'),t:_('新叶变小变窄变黄、簇生，像缺锌，但只出现在除草后靠近喷药的那一侧。问：最近有没有喷除草剂？','Young leaves small, narrow, yellow and bunched like Zn deficiency, but only on the side facing recent herbicide spraying. Ask: any weed spraying lately?','Daun muda kecil, sempit, kuning dan berkelompok seperti kekurangan Zn, tetapi hanya pada sisi menghadap semburan racun rumpai terkini. Tanya: ada sembur racun rumpai baru-baru ini?')},
 {art:'dry',leaf:'tree',title:_('干旱','Drought','Kemarau'),t:_('老叶卷曲、叶缘焦、落叶，像缺钾，但土是干的、全园同时出现。先浇水覆盖，一周后再看。','Older leaves curl, margins scorch, leaf drop like K deficiency — but soil is dry and the whole orchard shows it. Water and mulch first, re-check after a week.','Daun tua menggulung, tepi hangus, gugur seperti kekurangan K — tetapi tanah kering dan seluruh dusun menunjukkannya. Siram dan sungkup dahulu, semak semula seminggu kemudian.')},
 {art:'spotDisease',leaf:'spots',title:_('真菌叶斑病 / 藻斑病','Fungal leaf spot / algal spot','Bintik daun kulat / bintik alga'),t:_('斑点有明显边缘、中间灰白或有轮纹、斑点大小不一、会扩大——缺素的斑点是细小均匀的。','Spots with a clear edge, grey-white centre or rings, different sizes, growing — deficiency spots are small and uniform.','Bintik dengan tepi jelas, tengah kelabu-putih atau bergelang, saiz berbeza, membesar — bintik kekurangan kecil dan seragam.')},

 title:_('为什么要先看老叶还是新叶？','Why "old leaves first" or "young leaves first" matters','Mengapa "daun tua dahulu" atau "daun muda dahulu" penting'),
 p1:_('树缺某种养分时，会把已有的养分往最需要的地方送——新叶、花和果。能不能搬得动，取决于养分种类。','When a tree runs short of a nutrient, it moves what it already has to where it is needed most — the new leaves, flowers and fruit. Whether it can move depends on the nutrient.','Apabila pokok kekurangan sesuatu nutrien, ia memindahkan apa yang ada ke tempat paling diperlukan — daun baru, bunga dan buah. Sama ada boleh dipindahkan bergantung pada nutriennya.'),
 mob:_('可移动养分（氮、磷、钾、镁）：树能把它们从老叶拆下来运到新叶。于是老叶先变黄，新叶反而还绿。看到「下面黄、上面绿」就往这四种想。','Mobile nutrients (N, P, K, Mg): the tree can strip them out of old leaves and ship them to new growth. So the old, lower leaves yellow first while the new leaves stay green. "Yellow below, green on top" points to these four.','Nutrien mudah alih (N, P, K, Mg): pokok boleh mengeluarkannya daripada daun tua dan menghantarnya ke pucuk baru. Jadi daun tua di bawah menguning dahulu manakala daun baru kekal hijau. "Kuning di bawah, hijau di atas" menunjuk kepada empat ini.'),
 imm:_('不可移动养分（钙、硼、铁、锰、锌、铜、硫）：一旦进了叶片就固定在那里，搬不走。老叶留着自己的，新长出来的叶片拿不到——所以新叶、顶芽、幼果先出问题，老叶看起来正常。看到「上面黄或畸形、下面绿」就往这几种想。','Immobile nutrients (Ca, B, Fe, Mn, Zn, Cu, S): once they are built into a leaf they stay there and cannot be moved. Old leaves keep theirs; the new growth gets nothing — so the young leaves, growing tips and young fruit suffer first while old leaves look fine. "Yellow or distorted on top, green below" points to these.','Nutrien tidak mudah alih (Ca, B, Fe, Mn, Zn, Cu, S): sebaik sahaja masuk ke daun ia kekal di situ dan tidak boleh dipindahkan. Daun tua menyimpan miliknya; pucuk baru tidak mendapat apa-apa — jadi daun muda, pucuk dan buah muda terjejas dahulu manakala daun tua kelihatan baik. "Kuning atau cacat di atas, hijau di bawah" menunjuk kepada kumpulan ini.'),
 p2:_('这一个问题就把 13 种养分分成两半，所以辨症页第一步问的是它。它也决定了怎么补：不可移动养分（尤其钙、硼）必须直接喷到新叶和果上，土里施了也到不了果；可移动养分土施就能到。','This one question splits the 13 nutrients in half, which is why the Diagnose tab asks it first. It also decides how to feed: immobile nutrients (Ca and B above all) must be sprayed directly onto the new leaves and fruit — soil applications never reach the fruit — while mobile nutrients can be fed through the soil.','Satu soalan ini membahagi 13 nutrien kepada dua, sebab itu halaman Diagnosis bertanya dahulu. Ia juga menentukan cara membaja: nutrien tidak mudah alih (terutama Ca dan B) mesti disembur terus ke daun baru dan buah — pemberian ke tanah tidak sampai ke buah — manakala nutrien mudah alih boleh diberi melalui tanah.'),
 capL:_('可移动：老叶先黄','Mobile: old leaves yellow first','Mudah alih: daun tua kuning dahulu'),capR:_('不可移动：新叶先黄','Immobile: young leaves yellow first','Tidak mudah alih: daun muda kuning dahulu')
};
